<!-- Inside the Connectors library (Developer Guide > Architecture): the -->
<!-- Worker's processors invoke the connectors, which carry data to and -->
<!-- from the external systems. The SCIM 2.0 Service Provider Connector -->
<!-- reaches no external system itself: identity providers push to the Web -->
<!-- Application's SCIM endpoint, which keeps what arrives in the SCIM store -->
<!-- in PostgreSQL, and the connector imports from that store. -->
<!-- Five columns on a 200px pitch centred on the JIM.Connectors boundary -->
<!-- (60..1100), so the outer chips clear it by 26px on both sides. -->
<!-- The boundary title is painted last (SVG paints in document order) so -->
<!-- the Worker's arrows and their data packets pass behind it, not over -->
<!-- it; the knockout stroke on .jimdg-hub-title clears the gaps between -->
<!-- glyphs. Keep it the final element if you add anything to this file. -->
<!-- Hand-authored inline SVG, themed by the .jimdg-* classes in -->
<!-- docs/assets/stylesheets/custom.css (single source, light + dark). -->
<!-- Visual language: engineering/DESIGN.md > Diagrams. -->
<!-- NOTE: keep this file free of blank lines AND of comments inside the -->
<!-- <svg> element; it is inlined into markdown via pymdownx.snippets, and -->
<!-- python-markdown ends the raw-HTML block at either. Structure is -->
<!-- expressed with <g> groups instead. -->
<svg class="jim-diagram" viewBox="0 0 1160 500" role="img" aria-labelledby="jimdg-cc-title jimdg-cc-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="jimdg-cc-title">Inside the Connectors library</title>
  <desc id="jimdg-cc-desc">The JIM.Worker import and export processors invoke the connectors in the JIM.Connectors library. The LDAP Connector reads and writes Directory Services over LDAP and LDAPS; the File Connector reads and writes CSV and flat files, including HR exports; the SQL Connector reads and writes enterprise databases, Microsoft SQL Server and Oracle Database, through managed drivers; the SCIM 2.0 Client Connector reads and writes cloud applications that publish a SCIM 2.0 service provider interface. The SCIM 2.0 Service Provider Connector, in Preview, only imports: it reads the SCIM store in PostgreSQL, which holds the Users and Groups identity providers push to the Web Application's SCIM endpoint.</desc>
