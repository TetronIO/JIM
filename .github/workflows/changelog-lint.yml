name: changelog-lint

# Mechanical backstops for the documentation rules in engineering/CLAUDE.md:
#   1. Changelog quality: every [Unreleased] entry must lead with a canonical
#      emoji; internal-looking or over-long entries are warned.
#   2. Docs coupling: a PR that adds a user-facing entry (✨ new feature or
#      🔄 changed behaviour) must also update public docs under docs/, unless it
#      opts out explicitly (a "Docs: n/a - <reason>" line in the PR body, or the
#      'docs-not-needed' label).
#   3. Doc example safety: no PowerShell example (under docs/, or in the
#      module's own comment-based help) may invoke a JIM cmdlet using a
#      parameter ALIAS instead of its real name - see Lint-DocExamples.ps1 for
#      the defect this prevents (an -Id alias silently meaning "every Run
#      Profile on this Connected System", not "Run Profile 42"). Nor may an
#      example pass a parameter the cmdlet does not declare, or a page name a
#      JIM cmdlet that does not exist (#1454).
#   4. CSS brace balance: no stylesheet may contain an unclosed rule. One
#      missing '}' silently kills every rule below it for the rest of the file,
#      and nothing else in the pipeline notices - CSS is not compiled, bUnit
#      applies no stylesheet, and the page renders unstyled rather than failing.
#      See Test-CssBalance.ps1 for the two occurrences in site.css that this
#      prevents recurring.
#   5. Concept diagram label cuts: every edge label must either fit the cut its
#      diagram's label-cut mask makes for it, or stand clear of every edge; none
#      may cross a node or boundary outline; and no mask may enclose a surface
#      element. The cut geometry comes from rendered text metrics, so a reworded
#      label silently outgrows its cut and the edge reappears through the words -
#      see Update-DiagramLabelCuts.ps1. This is the only step needing a browser,
#      so it short-circuits unless the PR touched a diagram or the diagram tokens.
#   6. Docs site links: the site builds with `mkdocs build --strict` and every
#      link in the built site resolves (lychee, offline). Until this ran here,
#      nothing checked the docs before merge, and a broken anchor rendered as a
#      working link that went nowhere - see Test-DocsSite.ps1 (#1454). It
#      short-circuits unless the PR touched a docs source.
#   7. Docs conformance: every page is checked against the mechanical rules of
#      engineering/DOCUMENTATION_STANDARD.md (front matter, one name per page,
#      heading structure, code languages, stubs, page shape, accessibility,
#      language, the product vocabulary, and no growth on an over-budget page),
#      with a shrink-only baseline so
#      existing debt can only fall - see Test-DocsConformance.ps1 (#1454). It
#      reads Markdown sources only, so it is cheap enough to run on every PR.
#   8. Docs coverage: the cmdlets, environment variables and expression
#      functions the product has are all documented, nothing documented is
#      gone, and every link from the product into the docs resolves - see
#      Test-DocsCoverage.ps1 (#1454). It reads sources as well as pages, so a
#      change to either can fail it, which is why it runs on every PR.
#
# All eight run in this single job so they are enforced via the existing
# required "changelog-lint" status, without registering further required checks
# in the branch ruleset. A failure in any of them therefore surfaces as the
# "changelog-lint" check failing.
#
# Runs on every PR (no path filter) so it always reports a status and can safely
# be a required check: a path-filtered required check never reports on PRs that
# do not match, which blocks the merge indefinitely. Linting an empty or clean
# [Unreleased] is cheap and passes.
#
# Also runs on merge_group, so a merge queue on main gets the required check for
# each queued entry. There the diff-based lints compare the queue entry's base
# (main, or the entry ahead of it) with the entry's merge commit, which is the
# same change the PR made, now applied to the code it will actually land on.

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    # Explicit job name so the required-check context is the stable, descriptive
    # "changelog-lint" rather than the bare job id "lint".
    name: changelog-lint
    runs-on: ubuntu-latest
    # The range every diff-based step reads, from whichever event started the run;
    # exactly one of each pair is set.
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0  # need base..head history to compute the PR's changed files
      - name: Lint the [Unreleased] changelog section
        run: pwsh -File ./scripts/Lint-Changelog.ps1
      # Pull requests only. The opt-out lives in the PR body or a label, and a
      # merge_group payload carries neither, so in the queue every opted-out PR
      # would fail here. The check adds nothing there anyway: it already passed on
      # the PR, and the PR's set of changed files is the same in the queue.
      - name: Enforce public docs coupling for user-facing changes
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # Three-dot diff: the PR's own changes since the merge-base, not
          # unrelated commits that landed on the base branch in the meantime.
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          export CHANGED_FILES
          pwsh -File ./scripts/Lint-DocsCoupling.ps1
      - name: Lint PowerShell doc examples for parameter alias misuse
        run: pwsh -File ./scripts/Lint-DocExamples.ps1
      - name: Check docs conformance with the documentation standard
        run: |
          # Warnings are listed (and annotated) only for the pages this PR changed;
          # errors always are. BASE_SHA is what an over-budget page's size is
          # compared against (MNT-3).
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          export CHANGED_FILES
          pwsh -File ./scripts/Test-DocsConformance.ps1
      - name: Check docs coverage against what the product has
        run: pwsh -File ./scripts/Test-DocsCoverage.ps1
      - name: Check every stylesheet closes its rules
        run: pwsh -File ./scripts/Test-CssBalance.ps1
      - name: Check concept diagrams and reader layout controls
        run: |
          # A label cut can only be invalidated by a diagram source or the diagram
          # tokens; the lightbox framing can also be invalidated by the overlay
          # script itself. Both need a browser download, so the cost is paid on
          # those PRs alone. The reader layout controls (width toggle, resizable
          # table columns) share the browser and depend on the same stylesheet.
          # The step still runs (and passes) on every PR, so the
          # job keeps reporting and stays safe as a required check.
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if ! printf '%s\n' "$CHANGED_FILES" | grep -qE '^docs/assets/(diagrams/.+\.svg|stylesheets/custom\.css|javascripts/(diagram-zoom|docs-layout)\.js)$|^docs/overrides/main\.html$'; then
            echo "No diagram sources, stylesheet, overlay or layout script changed; skipping the browser checks."
            exit 0
          fi
          # Reuse the @playwright/mcp pin from setup.sh rather than adding a third
          # copy: tooling-pin-check keeps that pin and .mcp.json's in lockstep, and
          # a third would silently drift out of both.
          PLAYWRIGHT_MCP_VERSION="$(sed -n 's/^PLAYWRIGHT_MCP_VERSION="\(.*\)"$/\1/p' .devcontainer/setup.sh)"
          if [ -z "$PLAYWRIGHT_MCP_VERSION" ]; then
            echo "::error::Could not read PLAYWRIGHT_MCP_VERSION from .devcontainer/setup.sh"
            exit 1
          fi
          npm install -g "@playwright/mcp@${PLAYWRIGHT_MCP_VERSION}" --silent
          PLAYWRIGHT_CORE_CLI="$(find "$(npm root -g)/@playwright/mcp" -path '*/playwright-core/cli.js' | head -1)"
          node "$PLAYWRIGHT_CORE_CLI" install --with-deps chromium
          export JIM_PLAYWRIGHT_MODULE="$(dirname "$PLAYWRIGHT_CORE_CLI")"
          pwsh -File ./scripts/Update-DiagramLabelCuts.ps1 -Check
          pwsh -File ./scripts/Test-DiagramLightbox.ps1
          pwsh -File ./scripts/Test-DocsLayout.ps1
      - name: Detect docs source changes
        id: docs-sources
        run: |
          # The site includes CHANGELOG.md and files under test/integration/docker/
          # by snippet, so a change to either can break the docs build too.
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if printf '%s\n' "$CHANGED_FILES" | grep -qE '^(docs/|mkdocs\.yml$|CHANGELOG\.md$|test/integration/docker/|scripts/Test-DocsSite\.ps1$|\.github/workflows/changelog-lint\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No docs source changed; skipping the docs site build and link check."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      # The steps below are skipped (not failed) when no docs source changed, so the
      # job still reports and stays safe as a required check. setup-python provides
      # a pip the runner's system Python (externally managed) would refuse.
      - name: Set up Python for the docs site build
        if: steps.docs-sources.outputs.changed == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: 3.x
      - name: Build the docs site strictly and check every link in it
        if: steps.docs-sources.outputs.changed == 'true'
        run: |
          # The same pinned versions as docs.yml, so the site checked here is the
          # site that deploys.
          pip install -r docs/requirements.txt
          pwsh -File ./scripts/Test-DocsSite.ps1
