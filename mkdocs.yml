site_name: JIM Documentation
site_url: https://docs.junctional.io
repo_url: https://github.com/TetronIO/JIM
repo_name: TetronIO/JIM

# overrides/ is the theme's custom_dir, not content: without this it is also
# published as a static file at /overrides/home.html.
exclude_docs: |
  CLAUDE.md
  overrides/

# Link validation (#1454). Under --strict, which changelog-lint runs on every
# pull request that touches the docs, a warning fails the build:
#   - anchors: a link to a heading that does not exist on the target page,
#     which MkDocs 1.6 only reports at INFO by default, so a broken anchor
#     rendered as a working link that went nowhere;
#   - absolute_links: a link written as /path rather than relative, which
#     breaks if the site is ever served below the domain root;
#   - omitted_files: a page that exists but is not in the nav, so readers can
#     only reach it by guessing its URL.
# Relative links MkDocs leaves as-is for the browser to resolve at runtime
# (the Scalar API reference published at /api/reference/) stay silent here;
# lychee checks those against the built site instead.
validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
    absolute_links: warn
    unrecognized_links: ignore

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  logo: assets/images/jim-logo.png
  favicon: assets/images/jim-logo.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
        - docs
  - pymdownx.critic
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true

