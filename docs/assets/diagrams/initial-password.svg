<!-- The initial password journey (Concepts > Passwords): a provisioned -->
<!-- account is given its first password at the end of the export run, and -->
<!-- ends in one of four states. -->
<!-- Hand-authored inline SVG, themed by the .jimdg-* classes in -->
<!-- docs/assets/stylesheets/custom.css (single source, light + dark). -->
<!-- Visual language: engineering/DESIGN.md > Diagrams. -->
<!-- NOTE: keep this file free of blank lines AND of comments inside the -->
<!-- <svg> element; it is inlined into markdown via pymdownx.snippets, and -->
<!-- python-markdown ends the raw-HTML block at either. Structure is -->
<!-- expressed with <g> groups instead. -->
<svg class="jim-diagram" viewBox="0 0 1160 260" role="img" aria-labelledby="jimdg-ip-title jimdg-ip-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="jimdg-ip-title">What happens to a new account's first password</title>
  <desc id="jimdg-ip-desc">A Synchronisation Rule provisions an account. At the end of the export run, JIM sets that account's first password. The account then ends in one of four states: delivered, meaning it can be used; retrying, where the system could not be reached and JIM will try again on the next run; parked, where the system refused the password and an administrator needs to correct the settings; or expired, where a week passed without success and the password must be set another way.</desc>
  <g id="jimdg-ip-nodes">
    <rect class="jimdg-system" x="40" y="100" width="210" height="72" rx="8"/>
    <text class="jimdg-system-name" x="145" y="130">Account created</text>
    <text class="jimdg-system-sub" x="145" y="152">by a Synchronisation Rule</text>
    <rect class="jimdg-core" x="340" y="92" width="250" height="88" rx="8"/>
    <text class="jimdg-core-title" x="465" y="128">JIM sets a password</text>
    <text class="jimdg-core-sub" x="465" y="152">at the end of the export run</text>
  </g>
  <g id="jimdg-ip-outcomes">
    <rect class="jimdg-chip" x="700" y="14" width="430" height="52" rx="8"/>
    <text class="jimdg-chip-label jimdg-anchor-start" x="722" y="36">Delivered</text>
    <text class="jimdg-chip-sub jimdg-anchor-start" x="722" y="54">the account is ready to use</text>
    <rect class="jimdg-chip" x="700" y="76" width="430" height="52" rx="8"/>
    <text class="jimdg-chip-label jimdg-anchor-start" x="722" y="98">Retrying</text>
    <text class="jimdg-chip-sub jimdg-anchor-start" x="722" y="116">system unreachable; JIM tries on the next run</text>
    <rect class="jimdg-chip" x="700" y="138" width="430" height="52" rx="8"/>
    <text class="jimdg-chip-label jimdg-anchor-start" x="722" y="160">Parked</text>
    <text class="jimdg-chip-sub jimdg-anchor-start" x="722" y="178">password refused; correct the settings and save</text>
    <rect class="jimdg-chip" x="700" y="200" width="430" height="52" rx="8"/>
    <text class="jimdg-chip-label jimdg-anchor-start" x="722" y="222">Expired</text>
    <text class="jimdg-chip-sub jimdg-anchor-start" x="722" y="240">a week passed; set one another way</text>
  </g>
  <g id="jimdg-ip-edges">
    <line class="jimdg-spoke" x1="250" y1="136" x2="330" y2="136"/>
    <polygon class="jimdg-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(340,136) rotate(0)"/>
    <line class="jimdg-spoke" x1="590" y1="136" x2="692" y2="47"/>
    <polygon class="jimdg-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(700,40) rotate(-41.1)"/>
    <line class="jimdg-spoke" x1="590" y1="136" x2="690" y2="105"/>
    <polygon class="jimdg-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(700,102) rotate(-17.2)"/>
    <line class="jimdg-spoke" x1="590" y1="136" x2="690" y2="162"/>
    <polygon class="jimdg-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(700,164) rotate(14.3)"/>
    <line class="jimdg-spoke" x1="590" y1="136" x2="692" y2="220"/>
    <polygon class="jimdg-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(700,226) rotate(39.3)"/>
  </g>
  <g id="jimdg-ip-packets">
    <circle class="jimdg-packet" r="4.5">
      <animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" path="M250,136 L328,136"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle class="jimdg-packet" r="4.5">
      <animateMotion dur="2.4s" begin="-1.2s" repeatCount="indefinite" path="M590,136 L690,49"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
