      <rect x="314.4" y="159" width="124.2" height="18" rx="3" fill="#000000"/>
      <rect x="547" y="159" width="66" height="18" rx="3" fill="#000000"/>
      <rect x="762.4" y="159" width="41.2" height="18" rx="3" fill="#000000"/>
      <rect x="242.4" y="441" width="87.1" height="18" rx="3" fill="#000000"/>
      <rect x="389.1" y="441" width="88.4" height="18" rx="3" fill="#000000"/>
      <rect x="535.4" y="441" width="89.2" height="18" rx="3" fill="#000000"/>
      <rect x="709.5" y="441" width="35.1" height="18" rx="3" fill="#000000"/>
      <rect x="843" y="441" width="62.2" height="18" rx="3" fill="#000000"/>
    </mask>
  </defs>
  <g id="jimdg-sc-people">
