# Integration Testing Systems
# This compose file defines external systems used for integration testing
# See docs/INTEGRATION_TESTING.md for usage instructions
#
# PROJECT NAME:
# Uses a separate project name ('jim-integration') to avoid Docker Compose
# "orphan container" warnings when the main JIM stack (project 'jim') is
# started independently. Without this, Samba AD containers appear as orphans
# to the main stack because they aren't defined in docker-compose.yml.
#
# ARCHITECTURE SUPPORT:
# The base Samba AD image (diegogslomp/samba-ad-dc) supports both AMD64 and ARM64.
# Docker will automatically pull the correct architecture for your platform.
# This provides native performance on Apple Silicon Macs without Rosetta emulation.
#
# PERFORMANCE OPTIMISATION:
# By default, this uses pre-built Samba AD images with domain provisioning already complete.
# This reduces startup time from ~5 minutes to ~30 seconds per instance.
#
# To use pre-built images (default, fast):
#   docker compose -f docker-compose.integration-tests.yml up -d
#
# To build pre-built images locally:
#   pwsh test/integration/docker/samba-ad-prebuilt/Build-SambaImages.ps1 -Images All
#
# To fall back to standard images (slow, but no pre-build required):
#   SAMBA_IMAGE=diegogslomp/samba-ad-dc docker compose -f docker-compose.integration-tests.yml up -d

name: jim-integration

services:
  # Phase 1 - Scenario 1 & 3: HR to Directory, GALSYNC
  # Primary Samba AD instance for most scenarios
  samba-ad-primary:
    image: ${SAMBA_IMAGE_PRIMARY:-ghcr.io/tetronio/jim-samba-ad:primary}
    build:
      context: ./samba-ad-prebuilt
      dockerfile: Dockerfile
      args:
        SAMBA_DOMAIN: PANOPLY.LOCAL
        SAMBA_PASSWORD: Test@123!
    container_name: samba-ad-primary
    privileged: true
    environment:
      # diegogslomp/samba-ad-dc environment variables
      - REALM=PANOPLY.LOCAL
      - DOMAIN=PANOPLY
      - ADMIN_PASS=Test@123!
      - DNS_FORWARDER=8.8.8.8
      # Legacy environment variables for compatibility with existing scripts
      - DOMAINPASS=Test@123!
      - DNSFORWARDER=8.8.8.8
      - NOCOMPLEXITY=true
    # No ports exposed - internal to Docker network only for testing
    volumes:
      - samba-primary-data:/usr/local/samba/var
      - samba-primary-private:/usr/local/samba/private
      - samba-primary-etc:/usr/local/samba/etc
      - jim-connector-files-volume:/connector-files
    hostname: dc1
    # The DC's own name must resolve on jim-network, because that is the name it advertises as its
    # dNSHostName and carries in its TLS certificate. JIM's domain controller pinning connects to it
    # directly after discovering it, and Docker's DNS otherwise knows only the service name.
    networks:
      jim-network:
        aliases:
          - dc1.panoply.local
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/samba/bin/smbclient -L localhost -U% -N || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Pre-built image starts much faster (30s vs 180s)
      start_period: ${SAMBA_START_PERIOD:-30s}
    # Resource limits for consistent performance
    # Default: Suitable for Nano/Micro/Small templates (<100 users)
    # For Medium/Large templates, increase via environment variables
    deploy:
      resources:
        limits:
          cpus: ${SAMBA_PRIMARY_CPUS:-2.0}
          memory: ${SAMBA_PRIMARY_MEMORY:-2G}
        reservations:
          cpus: ${SAMBA_PRIMARY_CPUS_RESERVED:-0.5}
          memory: ${SAMBA_PRIMARY_MEMORY_RESERVED:-512M}

  # Phase 1 - Scenario 2: Directory to Directory Sync (Source)
  samba-ad-source:
    image: ${SAMBA_IMAGE_SOURCE:-ghcr.io/tetronio/jim-samba-ad:source}
    build:
      context: ./samba-ad-prebuilt
      dockerfile: Dockerfile
      args:
        SAMBA_DOMAIN: RESURGAM.LOCAL
        SAMBA_PASSWORD: Test@123!
    container_name: samba-ad-source
    privileged: true
    environment:
      # diegogslomp/samba-ad-dc environment variables
      - REALM=RESURGAM.LOCAL
      - DOMAIN=RESURGAM
      - ADMIN_PASS=Test@123!
      - DNS_FORWARDER=8.8.8.8
      # Legacy environment variables for compatibility with existing scripts
      - DOMAINPASS=Test@123!
      - DNSFORWARDER=8.8.8.8
      - NOCOMPLEXITY=true
    # No ports exposed - internal to Docker network only for testing
    volumes:
      - samba-source-data:/usr/local/samba/var
      - samba-source-private:/usr/local/samba/private
      - samba-source-etc:/usr/local/samba/etc
    hostname: dc1-source
    # The DC's own name must resolve on jim-network, because that is the name it advertises as its
    # dNSHostName and carries in its TLS certificate. JIM's domain controller pinning connects to it
    # directly after discovering it, and Docker's DNS otherwise knows only the service name.
    networks:
      jim-network:
        aliases:
          - dc1-source.resurgam.local
    profiles:
      - scenario2
      - scenario8
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/samba/bin/smbclient -L localhost -U% -N || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: ${SAMBA_START_PERIOD:-30s}
    # Resource limits for consistent performance
    deploy:
      resources:
        limits:
          cpus: ${SAMBA_SOURCE_CPUS:-2.0}
          memory: ${SAMBA_SOURCE_MEMORY:-2G}
        reservations:
          cpus: ${SAMBA_SOURCE_CPUS_RESERVED:-0.5}
          memory: ${SAMBA_SOURCE_MEMORY_RESERVED:-512M}

  # Phase 1 - Scenario 2: Directory to Directory Sync (Target)
  samba-ad-target:
    image: ${SAMBA_IMAGE_TARGET:-ghcr.io/tetronio/jim-samba-ad:target}
    build:
      context: ./samba-ad-prebuilt
      dockerfile: Dockerfile
      args:
        SAMBA_DOMAIN: GENTIAN.LOCAL
        SAMBA_PASSWORD: Test@123!
    container_name: samba-ad-target
    privileged: true
    environment:
      # diegogslomp/samba-ad-dc environment variables
      - REALM=GENTIAN.LOCAL
      - DOMAIN=GENTIAN
      - ADMIN_PASS=Test@123!
      - DNS_FORWARDER=8.8.8.8
      # Legacy environment variables for compatibility with existing scripts
      - DOMAINPASS=Test@123!
      - DNSFORWARDER=8.8.8.8
      - NOCOMPLEXITY=true
    # No ports exposed - internal to Docker network only for testing
    volumes:
      - samba-target-data:/usr/local/samba/var
      - samba-target-private:/usr/local/samba/private
      - samba-target-etc:/usr/local/samba/etc
    hostname: dc1-target
    # The DC's own name must resolve on jim-network, because that is the name it advertises as its
    # dNSHostName and carries in its TLS certificate. JIM's domain controller pinning connects to it
    # directly after discovering it, and Docker's DNS otherwise knows only the service name.
    networks:
      jim-network:
        aliases:
          - dc1-target.gentian.local
    profiles:
      - scenario2
      - scenario8
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/samba/bin/smbclient -L localhost -U% -N || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: ${SAMBA_START_PERIOD:-30s}
    # Resource limits for consistent performance
    deploy:
      resources:
        limits:
          cpus: ${SAMBA_TARGET_CPUS:-2.0}
          memory: ${SAMBA_TARGET_MEMORY:-2G}
        reservations:
          cpus: ${SAMBA_TARGET_CPUS_RESERVED:-0.5}
          memory: ${SAMBA_TARGET_MEMORY_RESERVED:-512M}

  # Phase 2 - Scenario 16: JIM SQL Connector matrix (Microsoft SQL Server provider)
  sqlserver-hris-a:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-hris-a
    environment:
      - ACCEPT_EULA=Y
      # MSSQL_SA_PASSWORD is the supported name; the unprefixed SA_PASSWORD is deprecated and the
      # container logs a warning for it on every start.
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD:-Test@123!}
      - MSSQL_PID=Developer
    # No ports exposed - internal to Docker network only for testing
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - jim-network
    profiles:
      - phase2
    healthcheck:
      # The 2022 image ships mssql-tools18, so /opt/mssql-tools/bin/sqlcmd does not exist, and sqlcmd is
      # not on PATH at all; the fully qualified tools18 path is the only one that resolves. -C trusts the
      # self-signed certificate SQL Server generates for itself, which tools18 refuses by default (it
      # encrypts by default, where the older tools did not), so without it the check fails on every
      # interval no matter how healthy the server is.
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "localhost", "-U", "sa", "-P", "Test@123!", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    # Sized for the Scenario 16 scale run (500,000 rows). SQL Server refuses to start with less than
    # 2GB and pages hard against a 500,000-row keyset scan at that floor.
    deploy:
      resources:
        limits:
          cpus: ${SQLSERVER_CPUS:-4.0}
          memory: ${SQLSERVER_MEMORY:-6G}
        reservations:
          cpus: ${SQLSERVER_CPUS_RESERVED:-1.0}
          memory: ${SQLSERVER_MEMORY_RESERVED:-2G}

  # Phase 2 - Scenario 16: JIM SQL Connector matrix (Oracle Database provider)
  #
  # Oracle Database Free 23ai, not the retired Express 21c image. Free 23ai pulls anonymously from
  # Oracle's own registry (no docker login, no licence click-through), so no third-party Docker Hub
  # redistribution is needed and the image is Oracle's own build. Note what changes from 21c XE:
  # the CDB service is FREE rather than XE, and the pluggable database JIM actually connects to is
  # FREEPDB1. Connect to the PDB, never the CDB: application schemas live in the PDB, and a CDB
  # connection cannot see them.
  oracle-hris-b:
    image: container-registry.oracle.com/database/free:23.9.0.0
    container_name: oracle-hris-b
    environment:
      - ORACLE_PWD=${ORACLE_SYS_PASSWORD:-Test@123!}
      - ORACLE_CHARACTERSET=AL32UTF8
      # Named explicitly rather than left to the image's default so the service name the scenario
      # connects to is stated in one place instead of inferred from the image's conventions.
      - ORACLE_PDB=FREEPDB1
    # No ports exposed - internal to Docker network only for testing
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - jim-network
    profiles:
      - phase2
    healthcheck:
      # The image's own status script, deliberately in preference to a hand-written sqlplus one-liner.
      # It authenticates as SYSDBA through operating-system authentication (`sqlplus -s /`), so no
      # password appears in the healthcheck at all: that is the durable fix for the credential quoting
      # the previous check got wrong (the password contains '@', which EZConnect reads as the
      # host separator, and '!', which some shells expand as history). It also checks more than a
      # one-liner can, failing while the pluggable database is still MOUNTED rather than open READ
      # WRITE, which is precisely the window in which a connection attempt would fail confusingly.
      test: ["CMD-SHELL", "/opt/oracle/checkDBStatus.sh >/dev/null || exit 1"]
      interval: 15s
      timeout: 30s
      retries: 10
      # First start creates the database from scratch, which is minutes rather than seconds. Subsequent
      # starts reuse the oracle-data volume and are far quicker, but the slow path is what has to fit.
      start_period: 600s
    # Oracle needs materially more than the directory containers, and 23ai refuses to start under
    # about 2GB. The scale run (500,000 rows) is what the upper limit is sized for.
    deploy:
      resources:
        limits:
          cpus: ${ORACLE_CPUS:-4.0}
          memory: ${ORACLE_MEMORY:-8G}
        reservations:
          cpus: ${ORACLE_CPUS_RESERVED:-1.0}
          memory: ${ORACLE_MEMORY_RESERVED:-2G}
    # Oracle uses System V shared memory for the SGA and Docker's 64MB default /dev/shm is far too
    # small; the instance fails to start with ORA-00845 without this.
    shm_size: 2gb

  # Phase 2 - PostgreSQL, staged for the JIM SQL Connector's priority 2 providers. Not used by
  # Scenario 16, which covers the priority 1 providers (Microsoft SQL Server and Oracle Database).
  postgres-test:
    image: postgres:16
    container_name: postgres-target
    environment:
      - POSTGRES_PASSWORD=Test@123!
      - POSTGRES_USER=jimtest
      - POSTGRES_DB=jimtest
    # No ports exposed - internal to Docker network only for testing
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    networks:
      - jim-network
    profiles:
      - phase2
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "jimtest"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenLDAP with two suffixes for multi-partition testing (Issue #72, Phase 1b)
  # Suffixes: dc=yellowstone,dc=local and dc=glitterband,dc=local
  # SCIM 2.0 test service provider for the SCIM Connector scenario.
  #
  # Serves the same MockScimProvider the unit suite drives in process, over HTTPS from a self-signed
  # certificate it generates at every start. HTTPS rather than plain HTTP because JIM refuses cleartext
  # to anything but a loopback address, and jim.worker reaches this container by hostname; the scenario
  # adds the certificate to JIM's Trusted Certificates, so the run also exercises the trust path a
  # customer with an internal certificate authority takes.
  scim-provider:
    image: ${SCIM_PROVIDER_IMAGE:-jim-scim-test-provider:local}
    build:
      context: ../../..
      dockerfile: test/integration/docker/scim/Dockerfile
      # Build-environment passthroughs, all empty/default outside constrained networks: an extra CA for
      # TLS-inspecting proxies, standard proxy variables, and host networking where the proxy listens on
      # the host's loopback (JIM_BUILD_NETWORK=host).
      network: ${JIM_BUILD_NETWORK:-default}
      args:
        EXTRA_CA_CERTS_BASE64: ${JIM_BUILD_EXTRA_CA_BASE64:-}
        HTTP_PROXY: ${JIM_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${JIM_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${JIM_BUILD_NO_PROXY:-}
    container_name: scim-provider
    environment:
      # Must match the container name: the certificate is issued for this, and the scenario connects
      # with Full Validation on, so a name mismatch would fail the connection rather than be ignored.
      - SCIM_HOSTNAME=scim-provider
      - SCIM_PORT=5300
      - SCIM_USER_COUNT=${SCIM_USER_COUNT:-25}
      - SCIM_GROUP_COUNT=${SCIM_GROUP_COUNT:-2}
      - SCIM_SUPPORTS_BULK=${SCIM_SUPPORTS_BULK:-true}
      - SCIM_BULK_MAX_OPERATIONS=${SCIM_BULK_MAX_OPERATIONS:-0}
      - SCIM_SUPPORTS_PATCH=${SCIM_SUPPORTS_PATCH:-true}
      - SCIM_PUBLISHES_SCHEMAS=${SCIM_PUBLISHES_SCHEMAS:-true}
      - SCIM_CERTIFICATE_PATH=/certificates/scim-provider.pem
    # No ports published: internal to the Docker network, like the directory containers.
    volumes:
      - scim-provider-certificates:/certificates
    networks:
      - jim-network
    profiles:
      - scim
    healthcheck:
      test: ["CMD", "dotnet", "--info"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  openldap-primary:
    image: ${OPENLDAP_IMAGE_PRIMARY:-ghcr.io/tetronio/jim-openldap:primary}
    build:
      context: ./openldap
      dockerfile: Dockerfile
    container_name: openldap-primary
    environment:
      - LDAP_ROOT=dc=yellowstone,dc=local
      - LDAP_ADMIN_USERNAME=admin
      - LDAP_ADMIN_PASSWORD=Test@123!
      - LDAP_CONFIG_ADMIN_ENABLED=yes
      - LDAP_CONFIG_ADMIN_USERNAME=admin
      - LDAP_CONFIG_ADMIN_PASSWORD=Test@123!
      - LDAP_ENABLE_TLS=no
      - LDAP_SKIP_DEFAULT_TREE=no
      - LDAP_ENABLE_ACCESSLOG=yes
      # Relaxed MDB durability (nosync) for test speed; a TEST-ONLY speed-up, not the
      # customer experience. The runner sets OPENLDAP_FAST_WRITES=no when invoked with
      # -DurableDirectoryWrites to run customer-representative tests.
      - LDAP_TEST_FAST_WRITES=${OPENLDAP_FAST_WRITES:-yes}
    # No ports exposed - internal to Docker network only for testing
    volumes:
      - openldap-primary-data:/bitnami/openldap
      - jim-connector-files-volume:/connector-files
    networks:
      - jim-network
    profiles:
      - openldap
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost:1389",
             "-b", "dc=yellowstone,dc=local",
             "-D", "cn=admin,dc=yellowstone,dc=local", "-w", "Test@123!",
             "-LLL", "(objectClass=organizationalUnit)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: ${OPENLDAP_PRIMARY_CPUS:-2.0}
          memory: ${OPENLDAP_PRIMARY_MEMORY:-2G}
        reservations:
          cpus: ${OPENLDAP_PRIMARY_CPUS_RESERVED:-0.5}
          memory: ${OPENLDAP_PRIMARY_MEMORY_RESERVED:-512M}

  # Phase 2 - MySQL, staged for the JIM SQL Connector's priority 2 providers. Not used by Scenario 16,
  # which covers the priority 1 providers (Microsoft SQL Server and Oracle Database).
  mysql-test:
    image: mysql:8
    container_name: mysql-test
    environment:
      - MYSQL_ROOT_PASSWORD=Test@123!
      - MYSQL_DATABASE=jimtest
      - MYSQL_USER=jimtest
      - MYSQL_PASSWORD=Test@123!
    # No ports exposed - internal to Docker network only for testing
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - jim-network
    profiles:
      - phase2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pTest@123!"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Samba AD primary volumes (diegogslomp/samba-ad-dc paths)
  samba-primary-data:
    name: jim-integration-samba-primary-var
  samba-primary-private:
    name: jim-integration-samba-primary-private
  samba-primary-etc:
    name: jim-integration-samba-primary-etc
  # Samba AD source volumes (scenario2)
  samba-source-data:
    name: jim-integration-samba-source-var
  samba-source-private:
    name: jim-integration-samba-source-private
  samba-source-etc:
    name: jim-integration-samba-source-etc
  # Samba AD target volumes (scenario2)
  samba-target-data:
    name: jim-integration-samba-target-var
  samba-target-private:
    name: jim-integration-samba-target-private
  samba-target-etc:
    name: jim-integration-samba-target-etc
  # Shared File Connector volume — must match the name declared in docker-compose.yml
  # so jim.worker, jim.web, and the test directory containers all share the same storage.
  jim-connector-files-volume:
    name: jim-connector-files-volume
    external: true
  scim-provider-certificates:
    name: jim-integration-scim-provider-certificates
  openldap-primary-data:
    name: jim-integration-openldap-primary-data
  sqlserver-data:
    name: jim-integration-sqlserver-data
  postgres-test-data:
    name: jim-integration-postgres-test-data
  mysql-data:
    name: jim-integration-mysql-data
  oracle-data:
    name: jim-integration-oracle-data

networks:
  jim-network:
    external: true
    name: jim-network
