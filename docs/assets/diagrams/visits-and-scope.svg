<g class="jimdg-dg-node"><rect class="jimdg-dg-terminal" x="12" y="654" width="162" height="79" rx="8"/><text class="jimdg-dg-label" x="93" y="681">Not visited by a Delta</text><text class="jimdg-dg-sub" x="93" y="698">a Full Synchronisation</text><text class="jimdg-dg-sub" x="93" y="715">visits it</text></g>
<g class="jimdg-dg-node"><rect class="jimdg-dg-terminal" x="186" y="654" width="162" height="62" rx="8"/><text class="jimdg-dg-label" x="267" y="681">Not reached</text><text class="jimdg-dg-sub" x="267" y="698">left as it is</text></g>
