<!-- The synchronised password journey (Concepts > Passwords): one password -->
<!-- change fans out to every enabled system the person has an account in, -->
<!-- and each of those ends in one of five states. Sibling of -->
<!-- initial-password.svg, which covers the one-account channel. -->
<!-- Hand-authored inline SVG, themed by the .jimdg-* classes in -->
<!-- docs/assets/stylesheets/custom.css (single source, light + dark). -->
<!-- Visual language: engineering/DESIGN.md > Diagrams. -->
<!-- NOTE: keep this file free of blank lines AND of comments inside the -->
<!-- <svg> element; it is inlined into markdown via pymdownx.snippets, and -->
<!-- python-markdown ends the raw-HTML block at either. Structure is -->
<!-- expressed with <g> groups instead. -->
<svg class="jim-diagram" viewBox="0 0 1160 320" role="img" aria-labelledby="jimdg-ps-title jimdg-ps-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="jimdg-ps-title">What happens to a synchronised password change</title>
  <desc id="jimdg-ps-desc">One person's password changes. JIM records one queued change per Connected System they have an account in, encrypted, and delivers each one separately, so no system waits on another and one unavailable system cannot fail the rest. Each queued change ends in one of five states: delivered, where the system has the new password and JIM keeps nothing; waiting, where the system was unavailable and JIM will try again after a backoff; parked, where the system refused the password and only a person can resolve that; expired, where it outlived its time to live and was never sent; or cancelled, where an administrator stopped it, which can be undone by retrying.</desc>
  <g id="jimdg-ps-nodes">
    <rect class="jimdg-system" x="40" y="130" width="210" height="72" rx="8"/>
    <text class="jimdg-system-name" x="145" y="160">Password changed</text>
    <text class="jimdg-system-sub" x="145" y="182">for one person</text>
    <rect class="jimdg-core" x="340" y="122" width="250" height="88" rx="8"/>
    <text class="jimdg-core-title" x="465" y="158">JIM queues the change</text>
    <text class="jimdg-core-sub" x="465" y="182">one change per system, encrypted</text>
  </g>
  <g id="jimdg-ps-outcomes">
    <rect class="jimdg-chip" x="700" y="10" width="430" height="52" rx="8"/>
    <text class="jimdg-chip-label jimdg-anchor-start" x="722" y="32">Delivered</text>
    <text class="jimdg-chip-sub jimdg-anchor-start" x="722" y="50">the system has it; JIM keeps nothing</text>
    <rect class="jimdg-chip" x="700" y="72" width="430" height="52" rx="8"/>
    <text class="jimdg-chip-label jimdg-anchor-start" x="722" y="94">Waiting</text>
    <text class="jimdg-chip-sub jimdg-anchor-start" x="722" y="112">system unavailable; JIM tries again after a backoff</text>
    <rect class="jimdg-chip" x="700" y="134" width="430" height="52" rx="8"/>
    <text class="jimdg-chip-label jimdg-anchor-start" x="722" y="156">Parked</text>
    <text class="jimdg-chip-sub jimdg-anchor-start" x="722" y="174">the system refused it; only a person can resolve that</text>
    <rect class="jimdg-chip" x="700" y="196" width="430" height="52" rx="8"/>
    <text class="jimdg-chip-label jimdg-anchor-start" x="722" y="218">Expired</text>
    <text class="jimdg-chip-sub jimdg-anchor-start" x="722" y="236">it outlived its time to live and was never sent</text>
    <rect class="jimdg-chip" x="700" y="258" width="430" height="52" rx="8"/>
    <text class="jimdg-chip-label jimdg-anchor-start" x="722" y="280">Cancelled</text>
    <text class="jimdg-chip-sub jimdg-anchor-start" x="722" y="298">an administrator stopped it; retrying undoes that</text>
  </g>
  <g id="jimdg-ps-edges">
    <line class="jimdg-spoke" x1="250" y1="166" x2="330" y2="166"/>
    <polygon class="jimdg-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(340,166) rotate(0)"/>
    <line class="jimdg-spoke" x1="590" y1="166" x2="690" y2="48"/>
    <polygon class="jimdg-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(700,36) rotate(-49.7)"/>
    <line class="jimdg-spoke" x1="590" y1="166" x2="690" y2="104"/>
    <polygon class="jimdg-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(700,98) rotate(-31.7)"/>
    <line class="jimdg-spoke" x1="590" y1="166" x2="690" y2="160"/>
    <polygon class="jimdg-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(700,160) rotate(-3.1)"/>
    <line class="jimdg-spoke" x1="590" y1="166" x2="690" y2="217"/>
    <polygon class="jimdg-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(700,222) rotate(27)"/>
    <line class="jimdg-spoke" x1="590" y1="166" x2="690" y2="273"/>
    <polygon class="jimdg-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(700,284) rotate(47)"/>
  </g>
  <g id="jimdg-ps-packets">
    <circle class="jimdg-packet" r="4.5">
      <animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" path="M250,166 L328,166"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle class="jimdg-packet" r="4.5">
      <animateMotion dur="2.4s" begin="-1.2s" repeatCount="indefinite" path="M590,166 L690,50"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle class="jimdg-packet" r="4.5">
      <animateMotion dur="2.4s" begin="-0.6s" repeatCount="indefinite" path="M590,166 L690,161"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
