<!-- Inside the Web Application (Developer Guide > Architecture): requests -->
<!-- enter through the authentication middleware and reach the Blazor pages, -->
<!-- the API controllers or the SCIM controllers, which call the -->
<!-- JimApplication facade. -->
<!-- Three columns (290, 580, 870) symmetric about the centre line; the -->
<!-- Identity Provider's two edges sit 40 units either side of its centre. -->
<!-- The boundary title is painted last (SVG paints in document order) so -->
<!-- the spokes and any data packet pass behind it, not over it; the -->
<!-- knockout stroke on .jimdg-hub-title clears the gaps between glyphs. -->
<!-- Keep it the final element if you add anything to this file. -->
<!-- Hand-authored inline SVG, themed by the .jimdg-* classes in -->
<!-- docs/assets/stylesheets/custom.css (single source, light + dark). -->
<!-- Visual language: engineering/DESIGN.md > Diagrams. -->
<!-- NOTE: keep this file free of blank lines AND of comments inside the -->
<!-- <svg> element; it is inlined into markdown via pymdownx.snippets, and -->
<!-- python-markdown ends the raw-HTML block at either. Structure is -->
<!-- expressed with <g> groups instead. -->
<svg class="jim-diagram" viewBox="0 0 1160 630" role="img" aria-labelledby="jimdg-wa-title jimdg-wa-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="jimdg-wa-title">Inside the Web Application</title>
  <desc id="jimdg-wa-desc">Administrators use the Blazor admin pages, automation clients call the REST API controllers, and an Identity Provider pushes Users and Groups over SCIM 2.0 to the SCIM controllers. Every request enters through the authentication middleware, which signs people in over OIDC against the Identity Provider and validates bearer tokens: SSO access tokens, API keys, and the SCIM keys scoped to one Connected System. The pages, the API controllers and the SCIM controllers all call the JimApplication facade, the Application Layer's single entry point.</desc>
  <defs>
    <mask id="jimdg-wa-labelcut" maskUnits="userSpaceOnUse" x="0" y="0" width="1160" height="630">
      <rect x="0" y="0" width="1160" height="630" fill="#ffffff"/>
      <rect x="798" y="116" width="64.2" height="19" rx="3" fill="#000000"/>
      <rect x="889.5" y="116" width="41.1" height="19" rx="3" fill="#000000"/>
      <rect x="230.5" y="302" width="119.3" height="19" rx="3" fill="#000000"/>
    </mask>
  </defs>
  <g id="jimdg-wa-people">
    <rect class="jimdg-stage" x="180" y="20" width="220" height="64" rx="8"/>
    <circle class="jimdg-person-glyph" cx="200" cy="41" r="6"/>
    <path class="jimdg-person-glyph" d="M189,63 a11,11 0 0 1 22,0 z"/>
    <text class="jimdg-stage-label" x="308" y="47">Administrator</text>
    <text class="jimdg-system-sub" x="308" y="68">web UI</text>
    <rect class="jimdg-stage" x="470" y="20" width="220" height="64" rx="8"/>
    <text class="jimdg-glyph-code" x="482" y="48">&gt;_</text>
    <text class="jimdg-stage-label" x="592" y="47">Automation Client</text>
    <text class="jimdg-system-sub" x="592" y="68">REST API · PowerShell</text>
    <rect class="jimdg-system" x="760" y="20" width="220" height="64" rx="8"/>
    <text class="jimdg-system-name" x="870" y="48">Identity Provider</text>
    <text class="jimdg-system-sub" x="870" y="69">OIDC sign-in · SCIM push</text>
  </g>
  <g id="jimdg-wa-boundary">
    <rect class="jimdg-hub" x="90" y="150" width="980" height="330" rx="8"/>
  </g>
  <g id="jimdg-wa-middleware">
    <rect class="jimdg-stage" x="130" y="220" width="900" height="64" rx="8"/>
    <text class="jimdg-stage-label" x="580" y="246">Authentication middleware</text>
    <text class="jimdg-system-sub" x="580" y="267">OIDC sign-in · bearer tokens: SSO, API and SCIM keys</text>
  </g>
  <g id="jimdg-wa-endpoints">
    <rect class="jimdg-stage" x="180" y="340" width="220" height="80" rx="8"/>
    <text class="jimdg-stage-label" x="290" y="373">Blazor pages</text>
    <text class="jimdg-system-sub" x="290" y="396">admin UI</text>
    <rect class="jimdg-stage" x="470" y="340" width="220" height="80" rx="8"/>
    <text class="jimdg-stage-label" x="580" y="373">API controllers</text>
    <text class="jimdg-system-sub" x="580" y="396">REST at /api/</text>
    <rect class="jimdg-stage" x="760" y="340" width="220" height="80" rx="8"/>
    <text class="jimdg-stage-label" x="870" y="373">SCIM controllers</text>
    <text class="jimdg-system-sub" x="870" y="396">SCIM 2.0 at /scim/v2/</text>
  </g>
  <g id="jimdg-wa-facade">
    <rect class="jimdg-stage" x="430" y="540" width="300" height="64" rx="8"/>
    <text class="jimdg-stage-label" x="580" y="566">JimApplication facade</text>
    <text class="jimdg-system-sub" x="580" y="587">Application Layer entry point</text>
  </g>
  <g mask="url(#jimdg-wa-labelcut)">
  <g id="jimdg-wa-edges">
    <line class="jimdg-spoke" x1="290" y1="84" x2="290" y2="210"/>
    <polygon class="jimdg-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(290,220) rotate(90)"/>
    <line class="jimdg-spoke" x1="580" y1="84" x2="580" y2="210"/>
    <polygon class="jimdg-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(580,220) rotate(90)"/>
    <line class="jimdg-spoke" x1="830" y1="84" x2="830" y2="210"/>
    <polygon class="jimdg-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(830,220) rotate(90)"/>
    <line class="jimdg-spoke" x1="910" y1="220" x2="910" y2="94"/>
    <polygon class="jimdg-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(910,84) rotate(-90)"/>
    <line class="jimdg-flow" x1="290" y1="284" x2="290" y2="330"/>
    <polygon class="jimdg-flow-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(290,340) rotate(90)"/>
    <line class="jimdg-flow" x1="580" y1="284" x2="580" y2="330"/>
    <polygon class="jimdg-flow-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(580,340) rotate(90)"/>
    <line class="jimdg-flow" x1="870" y1="284" x2="870" y2="330"/>
    <polygon class="jimdg-flow-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(870,340) rotate(90)"/>
    <line class="jimdg-flow" x1="290" y1="420" x2="491.3" y2="535"/>
    <polygon class="jimdg-flow-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(500,540) rotate(29.7)"/>
    <line class="jimdg-flow" x1="580" y1="420" x2="580" y2="530"/>
    <polygon class="jimdg-flow-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(580,540) rotate(90)"/>
    <line class="jimdg-flow" x1="870" y1="420" x2="668.7" y2="535"/>
    <polygon class="jimdg-flow-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(660,540) rotate(150.3)"/>
  </g>
  <g id="jimdg-wa-packets">
    <circle class="jimdg-packet" r="4.5">
      <animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M290,86 L290,208"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.2s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle class="jimdg-packet" r="4.5">
      <animateMotion dur="1.6s" begin="1.1s" repeatCount="indefinite" path="M290,286 L290,328"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.6s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle class="jimdg-packet" r="4.5">
      <animateMotion dur="2.2s" begin="-1s" repeatCount="indefinite" path="M580,86 L580,208"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.2s" begin="-1s" repeatCount="indefinite"/>
    </circle>
    <circle class="jimdg-packet" r="4.5">
      <animateMotion dur="1.6s" begin="0.1s" repeatCount="indefinite" path="M580,286 L580,328"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.6s" begin="0.1s" repeatCount="indefinite"/>
    </circle>
    <circle class="jimdg-packet" r="4.5">
      <animateMotion dur="2.2s" begin="-1.6s" repeatCount="indefinite" path="M830,86 L830,208"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.2s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
    <circle class="jimdg-packet" r="4.5">
      <animateMotion dur="1.6s" begin="0.6s" repeatCount="indefinite" path="M870,286 L870,328"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  </g>
  <g id="jimdg-wa-labels">
    <text class="jimdg-spoke-label jimdg-anchor-middle" x="830" y="130">SCIM 2.0</text>
    <text class="jimdg-spoke-label jimdg-anchor-middle" x="910" y="130">OIDC</text>
    <text class="jimdg-flow-label jimdg-anchor-middle" x="290" y="316">validates requests</text>
  </g>
  <g id="jimdg-wa-boundary-title">
    <text class="jimdg-hub-title" x="580" y="186">JIM.Web</text>
  </g>
</svg>
