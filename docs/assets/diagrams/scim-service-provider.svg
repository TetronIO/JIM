<!-- How a change an identity provider pushes over SCIM 2.0 reaches the Metaverse: answered -->
<!-- and kept at request time, imported and synchronised on the Connected System's Schedule. -->
<!-- Embedded on Connectors > JIM SCIM 2.0 Service Provider Connector. -->
<!-- Hand-authored inline SVG, themed by the .jimdg-* classes in -->
<!-- docs/assets/stylesheets/custom.css (single source, light + dark). -->
<!-- Visual language: engineering/DESIGN.md > Diagrams. -->
<!-- NOTE: no blank lines or comments inside the <svg> element (pymdownx -->
<!-- snippets inlines this into markdown); structure uses <g> groups. -->
<svg class="jim-diagram" viewBox="0 0 1220 280" role="img" aria-labelledby="jimdg-ssp-title jimdg-ssp-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="jimdg-ssp-title">From a SCIM request to the Metaverse</title>
  <desc id="jimdg-ssp-desc">An identity provider sends each change over HTTPS to its Connected System's SCIM endpoint in JIM. The left half happens automatically as each request arrives, with nothing to set up beyond a key: the endpoint checks the key and the SCIM schema, saves the change in that Connected System's store and answers straight away. The right half runs on the Connected System's Schedule, which the administrator sets, along with the Synchronisation Rules: a Delta Import reads the changes saved since the last import into the Connector Space, and Delta Synchronisation carries them into the Metaverse. Nothing the identity provider sends reaches the Connector Space or the Metaverse until the Schedule runs.</desc>
  <g id="jimdg-ssp-jim">
    <rect class="jimdg-hub" x="240" y="20" width="960" height="240" rx="8"/>
    <rect class="jimdg-layer" x="254" y="66" width="400" height="182" rx="8"/>
    <text class="jimdg-layer-title jimdg-anchor-middle" x="454" y="90">Automatic, as each request arrives</text>
    <text class="jimdg-note jimdg-anchor-middle" x="454" y="108">nothing to set up beyond a key</text>
    <rect class="jimdg-layer" x="670" y="66" width="516" height="182" rx="8"/>
    <text class="jimdg-layer-title jimdg-anchor-middle" x="928" y="90">On the Connected System's Schedule</text>
    <text class="jimdg-note jimdg-anchor-middle" x="928" y="108">you set the Schedule and the Synchronisation Rules</text>
    <rect class="jimdg-stage" x="270" y="124" width="160" height="90" rx="8"/>
    <text class="jimdg-stage-label" x="350" y="164">SCIM endpoint</text>
    <text class="jimdg-system-sub" x="350" y="185">checks key &amp; schema</text>
    <path class="jimdg-stage" d="M480,136 A80,14 0 0 1 640,136 L640,202 A80,14 0 0 1 480,202 Z"/>
    <ellipse class="jimdg-stage" cx="560" cy="136" rx="80" ry="14"/>
    <text class="jimdg-owner-name" x="560" y="170">Identity Provider</text>
    <text class="jimdg-stage-label" x="560" y="191">Store</text>
    <rect class="jimdg-stage" x="770" y="124" width="160" height="90" rx="8"/>
    <text class="jimdg-owner-name" x="850" y="154">Identity Provider</text>
    <text class="jimdg-stage-label" x="850" y="178">Connector Space</text>
    <text class="jimdg-system-sub" x="850" y="199">CSOs</text>
    <rect class="jimdg-core" x="990" y="124" width="182" height="90" rx="8"/>
    <text class="jimdg-core-title" x="1081" y="164">Metaverse</text>
    <text class="jimdg-core-sub" x="1081" y="188">MVOs · fused identities</text>
  </g>
  <g id="jimdg-ssp-systems">
    <rect class="jimdg-system" x="10" y="137" width="168" height="64" rx="8"/>
    <text class="jimdg-system-name" x="94" y="165">Identity Provider</text>
    <text class="jimdg-system-sub" x="94" y="186">SCIM 2.0 client</text>
  </g>
  <g id="jimdg-ssp-edges">
    <line class="jimdg-spoke" x1="178" y1="169" x2="260" y2="169"/>
    <polygon class="jimdg-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(270,169) rotate(0)"/>
    <text class="jimdg-spoke-label jimdg-anchor-middle" x="209" y="157">HTTPS</text>
    <line class="jimdg-flow" x1="430" y1="169" x2="470" y2="169"/>
    <polygon class="jimdg-flow-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(480,169) rotate(0)"/>
    <text class="jimdg-flow-label jimdg-anchor-middle" x="455" y="236">saved</text>
    <line class="jimdg-flow" x1="640" y1="169" x2="760" y2="169"/>
    <polygon class="jimdg-flow-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(770,169) rotate(0)"/>
    <text class="jimdg-flow-label jimdg-anchor-middle" x="722" y="236">Delta Import</text>
    <line class="jimdg-flow" x1="930" y1="169" x2="980" y2="169"/>
    <polygon class="jimdg-flow-arrow" points="0,0 -10,-5.5 -10,5.5" transform="translate(990,169) rotate(0)"/>
    <text class="jimdg-flow-label jimdg-anchor-middle" x="960" y="236">Delta Synchronisation</text>
  </g>
  <g id="jimdg-ssp-packets">
    <circle class="jimdg-packet" r="4.5">
      <animateMotion dur="2s" begin="0s" repeatCount="indefinite" path="M178,169 L258,169"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle class="jimdg-packet" r="4.5">
      <animateMotion dur="1.6s" begin="-0.8s" repeatCount="indefinite" path="M430,169 L468,169"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
    <circle class="jimdg-packet" r="4.5">
      <animateMotion dur="3.2s" begin="-1.2s" repeatCount="indefinite" path="M640,169 L758,169"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="3.2s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle class="jimdg-packet" r="4.5">
      <animateMotion dur="3.2s" begin="-2.4s" repeatCount="indefinite" path="M930,169 L978,169"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="3.2s" begin="-2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g id="jimdg-ssp-boundary-title">
    <text class="jimdg-hub-title" x="720" y="52">JIM</text>
  </g>
</svg>
