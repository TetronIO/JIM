# CodeQL analysis configuration for JIM.
#
# Wired into .github/workflows/codeql.yml via the `config-file:` input on
# codeql-action/init. Applies to every language in the matrix; query-filters
# targeting a specific query id (e.g. cs/...) naturally only affect the
# language that query belongs to.
#
# Disabled queries (with rationale):
#
#   cs/exposure-of-sensitive-information (CWE-359)
#   -----------------------------------------------
#   JIM is an identity management system. Logging identifiers and identity
#   attribute values (External IDs, display names, email-shaped usernames,
#   manager references, etc.) is core to operational diagnostics: without
#   them, a sync failure in a customer environment cannot be traced back to
#   the object that caused it.
#
#   CodeQL's heuristic source detection for this query flags any value
#   whose parameter or property name matches tokens like "email", "name",
#   "address" as private information, then reports every log call it
#   flows into as an exposure sink. In an IDM codebase that produces a
#   constant stream of false-positive-in-intent alerts across connectors,
#   the sync engine, workers, and the web layer - all places where logging
#   the identifier is the whole point.
#
#   Log injection (CWE-117) is addressed separately via LogSanitiser.Sanitise
#   in JIM.Utilities, which is applied at every ILogger/Serilog call site
#   that accepts user-controlled strings. That guardrail remains in force;
#   only the private-information-exposure query is disabled here.
#
#   Customer-facing logs containing identity data are protected by
#   deployment-level controls (file permissions, log retention, SIEM
#   access controls) which are outside CodeQL's visibility.

#
# Excluded paths (with rationale):
#
#   test/JIM.*.Tests/** (unit and component test projects)
#   ------------------------------------------------------
#   CodeQL's taint analysis treats environment-variable reads as sensitive
#   sources, so tests that read fixture values such as JIM_TEST_LDAP_HOST
#   and store them in plain fields are repeatedly flagged as "clear-text
#   storage of sensitive information". These are test hostnames and fixture
#   data, not secrets, and the alerts re-mint on every push that touches
#   the files (dismissals do not carry across analyses), producing a
#   recurring false-positive dance on any PR touching connector tests
#   (first seen on PR #1169, five alerts).
#
#   The exclusion is deliberately scoped to the unit/component test
#   projects only, not the whole test/ tree: integration scripts under
#   test/integration/ can handle real credentials for a running stack, so
#   anything scannable there stays in scope. Test project code never ships
#   in a JIM deployment.
#
#   Note: for compiled languages (C#) paths-ignore cannot limit what gets
#   built and extracted, and the codeql-action does NOT filter compiled-
#   language alerts by it either (proven on PR #1177: an excluded path's
#   alert re-minted on every analysis, re-opening past dismissal). The
#   enforcement point is scripts/Filter-Sarif.ps1, which the CodeQL
#   workflow runs between analysis and upload; it reads this block, so
#   this file remains the single place a path is excluded.
#
#   The filter also removes a result whose taint SOURCE is in an excluded
#   path when every one of its code flows starts there. The same fixture
#   reads above flow from the test into the LDAP Connector's own log calls,
#   where CodeQL reports them as clear-text storage against shipped code;
#   six such alerts stood open with a test file at the far end of every
#   flow. A result with even one flow from shipped code is kept.

#   test/JIM.TestScimServiceProvider/** (SCIM integration-test service provider)
#   -----------------------------------------------------------------------------
#   A test-only SCIM 2.0 service provider (the unit suite's MockScimProvider
#   hosted over HTTPS) that integration Scenario 15 drives the SCIM Connector
#   against. Its whole purpose is to echo request-derived JSON back at the
#   caller, which CodeQL's taint analysis reads as reflected XSS even though
#   every response is served as application/scim+json (never HTML) on an
#   isolated test network. Like the unit test projects above, this code never
#   ships in a JIM deployment: the image is labelled not-for-production and is
#   built only by the integration test runner.

paths-ignore:
  - test/JIM.*.Tests/**
  - test/JIM.TestScimServiceProvider/**

query-filters:
  - exclude:
      id: cs/exposure-of-sensitive-information
