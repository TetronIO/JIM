services:

  jim.web:
    container_name: jim.web
    image: ${DOCKER_REGISTRY-}jim-web${JIM_VERSION:+:${JIM_VERSION}}
    restart: always
    env_file: .env
    environment:
      # Docker-specific overrides (JIM_DB_HOSTNAME set in .env for external DB, or overridden by codespaces file)
      - JIM_DB_HOSTNAME=${JIM_DB_HOSTNAME:-jim.database}
      - JIM_LOG_PATH=/var/log/jim
      - JIM_LOG_REQUESTS=true
      # Pin the listening port so the healthcheck below and every published port mapping agree.
      # 8080 is the .NET base image's own default, and being above 1024 it binds as the non-root
      # 'app' user with no capabilities on any container runtime. Set here rather than in .env so
      # a stray ASPNETCORE_URLS in .env cannot move the port out from under the healthcheck.
      # docker-compose.production.yml adds HTTPS on 8443 and keeps 8080 for the healthcheck,
      # bound to the container's loopback interface.
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - jim-logs-volume:/var/log/jim
      - jim-keys-volume:/data/keys
      - jim-connector-files-volume:/connector-files
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    build:
      context: .
      dockerfile: src/JIM.Web/Dockerfile
      network: ${JIM_BUILD_NETWORK:-default}
      args:
        VERSION_SUFFIX: ${VERSION_SUFFIX:-}
        EXTRA_CA_CERTS_BASE64: ${JIM_BUILD_EXTRA_CA_BASE64:-}
        HTTP_PROXY: ${JIM_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${JIM_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${JIM_BUILD_NO_PROXY:-}
    depends_on:
      jim.database:
        condition: service_healthy
        required: false
      jim.worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - jim-network

  jim.worker:
    container_name: jim.worker
    image: ${DOCKER_REGISTRY-}jim-worker${JIM_VERSION:+:${JIM_VERSION}}
    restart: always
    env_file: .env
    environment:
      # Docker-specific overrides
      - JIM_DB_HOSTNAME=${JIM_DB_HOSTNAME:-jim.database}
      - JIM_LOG_PATH=/var/log/jim
    volumes:
      - jim-logs-volume:/var/log/jim
      - jim-keys-volume:/data/keys
      - jim-connector-files-volume:/connector-files
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    build:
      context: .
      dockerfile: src/JIM.Worker/Dockerfile
      network: ${JIM_BUILD_NETWORK:-default}
      args:
        VERSION_SUFFIX: ${VERSION_SUFFIX:-}
        EXTRA_CA_CERTS_BASE64: ${JIM_BUILD_EXTRA_CA_BASE64:-}
        HTTP_PROXY: ${JIM_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${JIM_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${JIM_BUILD_NO_PROXY:-}
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/healthcheck) )) -lt 60"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      jim.database:
        condition: service_healthy
        required: false
    networks:
      - jim-network

  jim.scheduler:
    container_name: jim.scheduler
    image: ${DOCKER_REGISTRY-}jim-scheduler${JIM_VERSION:+:${JIM_VERSION}}
    restart: always
    env_file: .env
    environment:
      # Docker-specific overrides
      - JIM_DB_HOSTNAME=${JIM_DB_HOSTNAME:-jim.database}
      - JIM_LOG_PATH=/var/log/jim
    volumes:
      - jim-logs-volume:/var/log/jim
      - jim-keys-volume:/data/keys
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    build:
      context: .
      dockerfile: src/JIM.Scheduler/Dockerfile
      network: ${JIM_BUILD_NETWORK:-default}
      args:
        VERSION_SUFFIX: ${VERSION_SUFFIX:-}
        EXTRA_CA_CERTS_BASE64: ${JIM_BUILD_EXTRA_CA_BASE64:-}
        HTTP_PROXY: ${JIM_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${JIM_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${JIM_BUILD_NO_PROXY:-}
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/healthcheck) )) -lt 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      jim.database:
        condition: service_healthy
        required: false
      jim.worker:
        condition: service_healthy
    networks:
      - jim-network

  jim.database:
    container_name: jim.database
    # Fully qualified: Podman refuses a short name like "postgres" unless the host defines an alias for it.
    # JIM_DB_IMAGE is for air-gapped installations only. Docker's classic image store drops the registry digest when
    # it loads the release bundle's image, so the pinned reference never resolves; the installer then checks the
    # loaded image's ID against the one the bundle recorded and sets JIM_DB_IMAGE to that ID. Leave it unset otherwise.
    image: ${JIM_DB_IMAGE:-docker.io/library/postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722}
    profiles:
      - with-db
    # PostgreSQL tuning. The memory settings come from .env, where setup.sh sizes them to the host's memory
    # (JIM_DB_SHARED_BUFFERS, JIM_DB_EFFECTIVE_CACHE_SIZE, JIM_DB_MAINTENANCE_WORK_MEM, JIM_DB_WORK_MEM and
    # JIM_DB_SHM_SIZE; see the Configuration Reference). Unset, they suit the documented 4 GB minimum host: every
    # release up to v0.16.0 fixed shared_buffers at 8GB here, which no host with less than about 10 GB could give,
    # so the database never started on one (#1943). The rest assume an SSD, and up to 16 cores.
    # shm_size is /dev/shm, which holds the shared memory of parallel queries; Docker's default is only 64 MB.
    # statement_timeout=300000 (5 minutes) prevents runaway queries
    # log_min_duration_statement (JIM_DB_LOG_MIN_DURATION) logs slow queries for performance analysis
    # logging_collector + jsonlog writes structured JSON logs to the shared log volume for the Logs UI.
    # The entrypoint wrapper creates a postgres-owned subdirectory before delegating to the
    # standard postgres entrypoint, since the shared volume root is owned by root.
    entrypoint: ["/bin/bash", "-c", "mkdir -p /var/log/jim/database && chown postgres:postgres /var/log/jim/database && exec docker-entrypoint.sh \"$$@\"", "--"]
    command: postgres -c max_connections=200 -c shared_buffers=${JIM_DB_SHARED_BUFFERS:-1GB} -c effective_cache_size=${JIM_DB_EFFECTIVE_CACHE_SIZE:-2GB} -c maintenance_work_mem=${JIM_DB_MAINTENANCE_WORK_MEM:-256MB} -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c default_statistics_target=100 -c random_page_cost=1.1 -c effective_io_concurrency=1000 -c work_mem=${JIM_DB_WORK_MEM:-4MB} -c min_wal_size=1GB -c max_wal_size=4GB -c max_worker_processes=16 -c max_parallel_workers_per_gather=4 -c max_parallel_workers=16 -c max_parallel_maintenance_workers=4 -c statement_timeout=300000 -c log_min_duration_statement=${JIM_DB_LOG_MIN_DURATION:-1000} -c logging_collector=on -c log_destination=jsonlog -c log_directory=/var/log/jim/database -c log_filename=jim.database.%Y%m%d.log -c log_rotation_age=1440 -c log_rotation_size=0 -c log_file_mode=0644
    restart: always
    shm_size: ${JIM_DB_SHM_SIZE:-1280mb}
    volumes:
      - jim-db-volume:/var/lib/postgresql
      - jim-logs-volume:/var/log/jim
    # No env_file: PostgreSQL reads none of JIM's settings, and its superuser can read the server's environment,
    # so .env's secrets stay out of this container. Compose still reads .env for the ${...} values in this service.
    environment:
      # .env sets LANG=en_GB.UTF-8 for the JIM services, but the postgres image does not ship that
      # locale, so initdb would fail on first start with "invalid locale settings". C.UTF-8 is built
      # into the image and gives a UTF8-encoded cluster with code-point ordering, which is stable
      # across glibc upgrades. (Plain C would work too, but creates a SQL_ASCII cluster that stores
      # unvalidated bytes.) LANG is only read when the cluster is first created; changing it has no
      # effect on an existing jim-db-volume.
      - LANG=C.UTF-8
      # Postgres uses different var names
      - POSTGRES_DB=${JIM_DB_NAME}
      - POSTGRES_USER=${JIM_DB_USERNAME}
      - POSTGRES_PASSWORD=${JIM_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - jim-network

networks:
  jim-network:
    name: jim-network
    driver: bridge

volumes:
  jim-db-volume:
    name: jim-db-volume
  jim-logs-volume:
    name: jim-logs-volume
  jim-keys-volume:
    name: jim-keys-volume
  # File Connector storage: imports and exports for the JIM File Connector.
  # Mounted on jim.web (for the file browser dialog) and jim.worker (read/write).
  # Customers integrating with fixed external file locations bind-mount over
  # subdirectories of this volume (e.g. a network share at /connector-files/hr-input).
  # See docs/connectors/jim-file-connector.md for configuration patterns.
  jim-connector-files-volume:
    name: jim-connector-files-volume
