# The Entra ID Connector checks (Scenarios 036 and 037, #361) on a GitHub-hosted runner, against the JIM test tenant
# in Microsoft Entra ID, from any branch: so a change to the Connector can be run live before it merges. The AD lab
# (ad-lab.yml) runs the same scenarios nightly from main; this is the on-demand, pre-merge run.
#
# Neither scenario uses a directory, so no lab is needed: the runner brings up JIM, with OpenLDAP as the (unused)
# directory, and the scenarios talk to the tenant. The harness signs in as the CI app through its federated
# credential, which trusts GitHub's OIDC token for the jim-entra-tenant environment only; no Graph secret is stored
# anywhere. That sign-in can rotate the credentials of an app holding User Administrator in the test tenant, so the
# environment requires a reviewer's approval for every run: whoever can push a branch cannot use it unapproved.
#
# Triggers: workflow_dispatch only. NEVER pull_request or push.
#
# Two runs at once, here or here and the AD lab, break each other: each replaces the certificate JIM holds for the
# Connector app. The concurrency group stops two runs of this workflow overlapping; avoid dispatching while the AD
# lab's Entra ID Connector step is running (about 08:00 UTC nightly).
#
# One-off setup, by a tenant administrator: on the CI app registration, add a federated credential for GitHub Actions
# with entity type Environment, repository TetronIO/JIM and environment jim-entra-tenant (subject
# repo:TetronIO/JIM:environment:jim-entra-tenant, audience api://AzureADTokenExchange). The environment holds the
# variables JIM_SSO_ENTRA_TENANT_ID and JIM_SSO_ENTRA_CI_CLIENT_ID, the same values as jim-ad-lab's.

name: jim-entra-connector-hosted

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Which Entra ID Connector scenario to run'
        type: choice
        options: ['All', '36', '37']
        default: 'All'

permissions:
  contents: read

concurrency:
  group: jim-entra-tenant
  cancel-in-progress: false

jobs:
  entra-connector:
    name: Entra ID Connector checks
    runs-on: ubuntu-24.04
    environment: jim-entra-tenant
    timeout-minutes: 90
    permissions:
      contents: read
      # The CI app's federated credential: GitHub's OIDC token for this environment, exchanged for a Graph token.
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Create the stack's .env
        run: |
          $bytes = New-Object byte[] 24
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $password = [Convert]::ToBase64String($bytes).Replace('+', 'A').Replace('/', 'B').Replace('=', '')
          $text = (Get-Content -LiteralPath .env.example -Raw) -replace '(?m)^JIM_DB_PASSWORD=.*$', "JIM_DB_PASSWORD=$password"
          Set-Content -LiteralPath .env -Value $text -NoNewline

      # Each runs even when the other fails, and the step fails if either did. The scenario reaches the script through
      # env, never interpolated into it.
      - name: Run the Entra ID Connector scenarios
        env:
          SCENARIO: ${{ inputs.scenario }}
          JIM_SSO_ENTRA_TENANT_ID: ${{ vars.JIM_SSO_ENTRA_TENANT_ID }}
          JIM_SSO_ENTRA_CI_CLIENT_ID: ${{ vars.JIM_SSO_ENTRA_CI_CLIENT_ID }}
        run: |
          $scenarios = if ($env:SCENARIO -eq 'All') { @('36', '37') } else { @($env:SCENARIO) }
          $failed = @()
          foreach ($number in $scenarios) {
            pwsh -File ./test/integration/Run-IntegrationTests.ps1 -Scenario $number -Template Nano -DirectoryType OpenLDAP
            if ($LASTEXITCODE -ne 0) { $failed += $number }
          }
          if ($failed.Count -gt 0) { Write-Host "::error::Entra ID Connector scenario(s) failed: $($failed -join ', ')"; exit 1 }

      # The scenario logs and, on a failure, the diagnostics the runner saved while JIM's database still held them
      # (the failed Activity's error and stack): without them a failure here cannot be diagnosed once the runner is
      # gone. The same files the AD lab uploads for these scenarios.
      - name: Upload the run's artefacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: jim-entra-connector-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test/integration/results/
            !test/integration/results/README.md
            !test/integration/results/docker-stats-*
            !test/integration/results/docker-events-*
          if-no-files-found: warn
          retention-days: 30
