# TEMPORARY: runs ci.yml's deployment-boot job on pushes to this branch, so it can be proven on GitHub's
# runners before a pull request exists. Delete before opening the pull request.
name: Deployment boot (trial)

on:
  push:
    branches: [ "claude/busy-newton-ldo1x1" ]

permissions:
  contents: read

concurrency:
  group: deployment-boot-trial
  cancel-in-progress: true

jobs:
  deployment-boot:
    # Installs JIM the way a customer does, three times over: from a release bundle built from this commit,
    # with the bundle's own setup.sh, offline, on Docker, on rootful Podman and on rootless Podman. Each leg
    # then checks what the customer would: JIM ready over HTTPS with the certificate the installer created,
    # every container's own health check passing, and data kept through a stop and start
    # (test/ci/deployment/Invoke-DeploymentBoot.ps1). Last, it compares what the two runtimes actually run,
    # so the compose files and the pod files cannot drift apart unnoticed (Compare-RuntimeParity.ps1). This
    # is the only check that boots the production deployment of either runtime.
    #
    # Informational for now: it becomes a required check once it has passed ten consecutive runs (D6 of
    # engineering/plans/doing/PODMAN_SUPPORT.md), which is a change to the main ruleset.
    #
    # Always on a GitHub-hosted runner, pushes to main included: a fresh VM with systemd, Docker and Podman,
    # where the check can create an account, change a sysctl and take port 443. The self-hosted runners are
    # not assumed to allow any of that.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

    # Three JIM installations, their images twice more in Podman's storage, and the bundle: more than the
    # runner's free disk. The Android SDK alone is about 9 GB, and nothing here uses it.
    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift
        df -h /

    # The bundle's PostgreSQL archive must carry the registry manifest its digest pin needs, or the image
    # would not resolve offline, and only Docker's containerd image store saves it: Build-ReleaseBundle.ps1
    # refuses a bundle without it (#1854 is the classic store's side of this).
    - name: Use Docker's containerd image store
      run: |
        config=/etc/docker/daemon.json
        current=$(sudo cat "$config" 2>/dev/null || echo '{}')
        echo "$current" | jq '.features["containerd-snapshotter"] = true' | sudo tee "$config" > /dev/null
        sudo systemctl restart docker
        docker info -f '{{.DriverStatus}}'

    # GitHub's image sets XDG_CONFIG_HOME=/home/runner/.config for every account, which the rootless leg's jim
    # account's systemd manager would inherit: Podman's Quadlet generator would then look for the account's units
    # in the runner's folder, which it cannot read, and generate none. No real host points every account at one
    # account's folder, so this is undone here rather than worked around in the installer.
    - name: Stop pointing every account at the runner's configuration folder
      run: |
        for file in /etc/environment /etc/environment.d/*.conf /etc/security/pam_env.conf; do
          if sudo grep -qs '^XDG_CONFIG_HOME' "$file"; then
            echo "Removing XDG_CONFIG_HOME from $file"
            sudo sed -i '/^XDG_CONFIG_HOME/d' "$file"
          fi
        done

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

    # Built as scan-images builds them, with the same build arguments, so that they come from the cache
    # scan-images keeps; read-only here, since scan-images writes it. The tag is the bundle's version.
    - name: Date the apt upgrade layer
      id: apt_refresh
      run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

    - name: Build jim-web
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        file: src/JIM.Web/Dockerfile
        load: true
        tags: ghcr.io/tetronio/jim-web:ci
        build-args: |
          VERSION=scan
          APT_REFRESH=${{ steps.apt_refresh.outputs.date }}
        cache-from: type=gha,scope=jim-web

    - name: Build jim-worker
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        file: src/JIM.Worker/Dockerfile
        load: true
        tags: ghcr.io/tetronio/jim-worker:ci
        build-args: |
          VERSION=scan
          APT_REFRESH=${{ steps.apt_refresh.outputs.date }}
        cache-from: type=gha,scope=jim-worker

    - name: Build jim-scheduler
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        file: src/JIM.Scheduler/Dockerfile
        load: true
        tags: ghcr.io/tetronio/jim-scheduler:ci
        build-args: |
          VERSION=scan
          APT_REFRESH=${{ steps.apt_refresh.outputs.date }}
        cache-from: type=gha,scope=jim-scheduler

    - name: Build the release bundle
      shell: pwsh
      run: ./scripts/Build-ReleaseBundle.ps1 -Version ci -SkipImageBuild -SkipArchive -OutputPath "$env:RUNNER_TEMP/bundle"

    - name: Start the test identity provider
      id: idp
      shell: pwsh
      run: |
        $authority = ./test/ci/deployment/Start-TestIdentityProvider.ps1
        "JIM_CI_AUTHORITY=$authority" >> $env:GITHUB_ENV
        "## Deployment boot" >> $env:GITHUB_STEP_SUMMARY

    # One leg at a time, since each takes port 443; each stops JIM when it finishes, pass or fail. A failed
    # leg does not stop the next, so that one run reports every runtime.
    - name: Docker
      shell: pwsh
      run: ./test/ci/deployment/Invoke-DeploymentBoot.ps1 -BundlePath "$env:RUNNER_TEMP/bundle/jim-release-ci" -Runtime docker -Authority $env:JIM_CI_AUTHORITY -OutputPath "$env:RUNNER_TEMP/deployment-boot"

    - name: Podman, rootful
      if: ${{ !cancelled() && steps.idp.outcome == 'success' }}
      shell: pwsh
      run: ./test/ci/deployment/Invoke-DeploymentBoot.ps1 -BundlePath "$env:RUNNER_TEMP/bundle/jim-release-ci" -Runtime podman -Authority $env:JIM_CI_AUTHORITY -OutputPath "$env:RUNNER_TEMP/deployment-boot"

    - name: Podman, rootless
      if: ${{ !cancelled() && steps.idp.outcome == 'success' }}
      shell: pwsh
      run: ./test/ci/deployment/Invoke-DeploymentBoot.ps1 -BundlePath "$env:RUNNER_TEMP/bundle/jim-release-ci" -Runtime podman -Rootless -Authority $env:JIM_CI_AUTHORITY -OutputPath "$env:RUNNER_TEMP/deployment-boot"

    - name: Compare what the runtimes run
      if: ${{ !cancelled() && steps.idp.outcome == 'success' }}
      shell: pwsh
      run: |
        $out = "$env:RUNNER_TEMP/deployment-boot"
        ./test/ci/deployment/Compare-RuntimeParity.ps1 -Reference "$out/docker.inspect.json" -Candidate "$out/podman-rootful.inspect.json", "$out/podman-rootless.inspect.json"

    # The installers' logs, each leg's inspect output and, for a failed leg, its containers' logs.
    - name: Upload the deployment-boot output
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: deployment-boot
        path: ${{ runner.temp }}/deployment-boot
        retention-days: 14
