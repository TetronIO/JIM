# CI workflow - builds, tests, and scans for vulnerabilities
# Runs on pushes to main and all pull requests, and nightly on main (image jobs only)

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:  # This will run on ALL pull requests regardless of source/target branch
  # Nightly, main only (a scheduled run always uses the default branch), and only the image jobs:
  # discover-base-images, scan-images and their summary. Everything else in this file depends only
  # on the commit, which a push has already tested. The images also depend on what they pull from
  # outside at build time (the noble archive through apt-get upgrade, the unpinned curl and
  # iputils-ping), and that can break or go stale with no commit at all: #1374 was main failing to
  # build for two days with every check green. apt-pin-check probes the pinned packages daily;
  # this builds, starts and scans the whole image. It also reports a newly published fix for a
  # HIGH/CRITICAL CVE within a day instead of on whichever PR happens to run next. Scheduled runs
  # use GitHub-hosted runners (the runs-on expressions below send only push to the self-hosted
  # host), and GitHub notifies whoever last edited this cron line when one fails. 00:30 UTC, just
  # after the APT_REFRESH date turns over, so the day's first build of the apt layer lands in the
  # cache before the working day's PRs need it.
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: read

# Within one run the jobs fan out across every available runner. Across runs, push
# builds on main are serialised: ldaps-tests mutates machine-global state on the
# self-hosted host (fixed container names, /etc/hosts entries, a trust-store CA),
# and sql-tls-tests uses a fixed container name too, so two overlapping main runs
# would corrupt each other's fixtures. A newer queued
# main run supersedes an older queued one, which is fine: the newest commit contains
# the older ones. PR runs get one group per PR so a new push cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'main-push' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build-and-test:

    # Split-trust runner model: push events only happen once code is on main (merged by
    # an authorised person), so they may use the fast self-hosted runner. pull_request
    # events execute code from anyone's fork and must stay on GitHub-hosted VMs; a
    # self-hosted runner on a public repo would hand fork authors code execution on our
    # infrastructure. The org runner group must also allowlist this workflow at
    # refs/heads/main only, so that a fork PR editing this expression still cannot
    # reach the runner. Every job in this file uses the same expression.
    # Depends only on the commit, so the nightly run (image drift only) skips it; see the schedule trigger.
    if: github.event_name != 'schedule'
    runs-on: ${{ github.event_name == 'push' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore JIM.sln --locked-mode
    - name: Build
      run: dotnet build JIM.sln --no-restore
    - name: Test .NET
      run: dotnet test JIM.sln --no-build --verbosity normal

    # Every source file must carry the Tetron copyright notice. .editorconfig
    # only ever covered .cs (and only as a suggestion), so this is the gate for
    # .razor, .ps1, .psm1, .psd1 and .sh.
    - name: Lint copyright headers
      shell: pwsh
      run: pwsh -File ./scripts/Lint-CopyrightHeaders.ps1

    # PowerShell Pester Tests for the JIM PowerShell module
    - name: Install Pester
      shell: pwsh
      run: |
        Set-PSRepository PSGallery -InstallationPolicy Trusted
        Install-Module -Name Pester -MinimumVersion 5.0 -Force -Scope CurrentUser
    - name: Run Pester Tests
      shell: pwsh
      run: |
        $config = New-PesterConfiguration
        $config.Run.Path = @("./src/JIM.PowerShell/Tests", "./scripts/Tests", "./test/integration/utils", "./test/integration/ad-lab", "./test/ci", "./.github/scripts/Tests")
        $config.Run.Exit = $true
        $config.Output.Verbosity = "Detailed"
        $config.TestResult.Enabled = $true
        $config.TestResult.OutputPath = "./TestResults/pester-results.xml"
        $config.TestResult.OutputFormat = "NUnitXml"
        Invoke-Pester -Configuration $config
    - name: Upload Pester Test Results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      if: always()
      with:
        name: pester-test-results
        path: ./TestResults/pester-results.xml

  database-tests:
    # Runs the RequiresPostgres NUnit tier (the "Database-backed component tests"
    # tier in engineering/TESTING_STRATEGY.md) against a real PostgreSQL service.
    # These fixtures self-skip in the in-memory build-and-test job (JIM_TEST_RESET_DB
    # unset); here they execute, guarding provider-specific and raw-SQL behaviour the
    # EF Core in-memory provider cannot reproduce (the class of bug behind #849/#850).
    # See issue #861. Runs on every PR so a failure blocks the merge.
    # Depends only on the commit, so the nightly run (image drift only) skips it; see the schedule trigger.
    if: github.event_name != 'schedule'
    runs-on: ${{ github.event_name == 'push' && 'self-hosted' || 'ubuntu-latest' }}

    services:
      postgres:
        # Pinned to match the production database image in docker-compose.yml; bump
        # both together. Dependabot's docker ecosystem does not scan workflow service
        # images, so this digest pin is maintained by hand.
        image: postgres:18.4@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jim_test
          # Same locale as the bundled database in docker-compose.yml (UTF8, code-point
          # ordering), so these tests see the sorting and case rules production runs with.
          # The image's own default is en_US.utf8.
          LANG: C.UTF-8
        # Ephemeral host port. A fixed 5432:5432 collides on the self-hosted runner
        # host, where a second runner service can be running another job (e.g. a
        # JIM-Bench run) with its own PostgreSQL on the same port at the same moment.
        ports:
          - 5432
        # Hold the job's steps until PostgreSQL is accepting connections. -U names a role that
        # exists: without it pg_isready connects as the runner's OS user, and the server logs
        # 'role "root" does not exist' every ten seconds into the service log this job is
        # diagnosed from.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # The RequiresPostgres fixtures read these to build the connection string and to
    # opt in (JIM_TEST_RESET_DB being set is what flips them from Assert.Ignore to run).
    # jim_test is a throwaway database: each fixture migrates the schema once and empties
    # every table between tests (PostgresTestDatabase.ResetAsync in JIM.TestSupport).
    env:
      JIM_TEST_RESET_HOST: localhost
      JIM_TEST_RESET_USER: postgres
      JIM_TEST_RESET_PASSWORD: postgres
      JIM_TEST_RESET_DB: jim_test

    steps:
    # The database is discarded when the job ends, so durability buys nothing here, and paying
    # for it made the job hostage to the runner's disk: on slow-disk runners PostgreSQL's
    # checkpoints took 40 to 50 seconds each and every test ran about 4.5 times slower, the likely
    # source of the 25 to 39 minute runs. A service container cannot be given server
    # arguments, so the settings go in through ALTER SYSTEM; all three take effect on reload.
    # The container id is passed via env rather than interpolated into the script.
    - name: Relax durability on the throwaway database
      env:
        POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      run: |
        docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 \
          -c "ALTER SYSTEM SET fsync = off" \
          -c "ALTER SYSTEM SET synchronous_commit = off" \
          -c "ALTER SYSTEM SET full_page_writes = off" \
          -c "SELECT pg_reload_conf()"
        docker exec "$POSTGRES_CONTAINER" psql -U postgres -tA \
          -c "SELECT name || ' = ' || setting FROM pg_settings WHERE name IN ('fsync', 'synchronous_commit', 'full_page_writes') ORDER BY name"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore JIM.sln --locked-mode
    - name: Build
      run: dotnet build JIM.sln --no-restore
    - name: Run database-backed tests (RequiresPostgres)
      # The ephemeral host port must be read here rather than in the job-level env block
      # above: the job context is only available inside steps, and referencing it at job
      # level invalidates the whole workflow file (GitHub reports "workflow file issue"
      # and no CI jobs run at all).
      env:
        JIM_TEST_RESET_PORT: ${{ job.services.postgres.ports['5432'] }}
      run: dotnet test JIM.sln --no-build --filter "Category=RequiresPostgres" --verbosity normal

  ldaps-tests:
    # Runs the RequiresLdaps NUnit tier against real directory servers over TLS:
    # four OpenLDAP variants (system-trusted CA, JIM-store-only CA, expired
    # certificate, an intermediate CA the server does not send), a Samba AD Domain Controller and a 389 Directory Server pair
    # (JIM-store-only CA, expired certificate). These fixtures self-skip in
    # build-and-test (JIM_TEST_LDAPS_HOST unset); here the fixture script stands
    # the servers up and exports the environment variables that flip them from
    # Assert.Ignore to run. This is the regression net for LDAPS certificate
    # validation (#1132): connections must be refused for untrusted issuers, name
    # mismatches and expired certificates, with the reason reported, and must
    # succeed when the CA is in the JIM certificate store. See issue #1141.
    # Runs on every PR so a failure blocks the merge.
    #
    # LDAPTLS_REQCERT must never be set here: it would disable libldap certificate
    # validation for the whole process and turn every refusal case into a false pass,
    # which is the exact defect class this job exists to catch. A guard step asserts it.
    # Depends only on the commit, so the nightly run (image drift only) skips it; see the schedule trigger.
    if: github.event_name != 'schedule'
    runs-on: ${{ github.event_name == 'push' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore JIM.sln --locked-mode
    - name: Build
      run: dotnet build test/JIM.Worker.Tests/ --no-restore
    - name: Assert LDAPTLS_REQCERT is not in scope
      run: |
        if [ -n "${LDAPTLS_REQCERT}" ]; then
          echo "LDAPTLS_REQCERT is set; it would disable certificate validation and void this job."
          exit 1
        fi
    # Docker Hub rate-limits anonymous pulls (429s observed in testing), so pull the
    # fixture images up front with a retry rather than letting the fixture script's
    # docker run fail on a transient refusal.
    - name: Pull directory server images
      run: |
        for image in bitnamilegacy/openldap:latest diegogslomp/samba-ad-dc:latest 389ds/dirsrv:3.1; do
          for attempt in 1 2 3; do
            docker pull "$image" && break
            if [ "$attempt" = "3" ]; then
              echo "Failed to pull $image after 3 attempts."
              exit 1
            fi
            sleep 30
          done
        done
    # The script needs root: it writes /etc/hosts entries for the certificate names
    # and installs one test CA into the machine trust store. sudo -E preserves
    # GITHUB_ENV so the script can export the connection details to later steps.
    - name: Start LDAPS certificate test servers
      run: sudo -E pwsh -File ./test/scripts/Start-LdapsCertificateTestServers.ps1 -IncludeSambaAd -Include389
    - name: Run LDAPS certificate validation tests (RequiresLdaps)
      run: dotnet test test/JIM.Worker.Tests/ --no-build --filter "Category=RequiresLdaps" --verbosity normal
    # On push events this job runs on the self-hosted runner, which is NOT ephemeral:
    # without teardown the containers, /etc/hosts entries and the trust-store CA
    # persist on the machine between jobs. Harmless on GitHub-hosted PR runs, essential
    # on the self-hosted host; run it unconditionally.
    - name: Tear down LDAPS certificate test servers
      if: always()
      run: sudo pwsh -File ./test/scripts/Start-LdapsCertificateTestServers.ps1 -Stop

  sql-tls-tests:
    # Runs the RequiresSqlTls NUnit tier against a real Microsoft SQL Server
    # presenting a certificate issued by a CA nobody trusts. These fixtures
    # self-skip in build-and-test (JIM_TEST_SQLTLS_HOST unset); here the fixture
    # script stands the server up and exports the environment variables that flip
    # them from Assert.Ignore to run. This is the regression net for the SQL
    # Connector's certificate trust (#1472): an encrypted connection must succeed
    # when the issuer is in the JIM certificate store, and must be refused for an
    # untrusted issuer or a name mismatch with the reason reported, which only a
    # real TDS PRELOGIN exchange can show. Runs on every PR so a failure blocks the
    # merge. Unlike ldaps-tests it needs no root: it writes no hosts entries and
    # leaves the machine trust store alone.
    # Depends only on the commit, so the nightly run (image drift only) skips it; see the schedule trigger.
    if: github.event_name != 'schedule'
    runs-on: ${{ github.event_name == 'push' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore JIM.sln --locked-mode
    - name: Build
      run: dotnet build test/JIM.Worker.Tests/ --no-restore
    # Pulled up front with a retry, as ldaps-tests does, so a transient registry
    # refusal fails here with a clear message rather than inside docker run.
    - name: Pull SQL Server image
      run: |
        for attempt in 1 2 3; do
          docker pull mcr.microsoft.com/mssql/server:2022-latest && exit 0
          sleep 30
        done
        echo "Failed to pull mcr.microsoft.com/mssql/server:2022-latest after 3 attempts."
        exit 1
    - name: Start SQL Server TLS test server
      run: pwsh -File ./test/scripts/Start-SqlServerTlsTestServer.ps1
    - name: Run SQL Server TLS certificate validation tests (RequiresSqlTls)
      run: dotnet test test/JIM.Worker.Tests/ --no-build --filter "Category=RequiresSqlTls" --verbosity normal
    # The self-hosted runner used on push events is not ephemeral; without this the
    # container and generated certificates outlive the job.
    - name: Tear down SQL Server TLS test server
      if: always()
      run: pwsh -File ./test/scripts/Start-SqlServerTlsTestServer.ps1 -Stop

  discover-base-images:
    # Discover production Dockerfiles and enforce the digest-pinning policy.
    # Production Dockerfiles are identified by the "# jim-compliance: production-image"
    # directive; unlabelled Dockerfiles (devcontainer, test fixtures) are out of scope.
    # Any production Dockerfile with a non-digest-pinned FROM line fails here. The job
    # emits two matrices: the unique base image references (the pin policy's subject)
    # and the production Dockerfiles themselves, which scan-images builds and scans.
    # See .github/scripts/discover-base-images.ps1 and engineering/DEVELOPER_GUIDE.md.
    runs-on: ${{ github.event_name == 'push' && 'self-hosted' || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      image_matrix: ${{ steps.discover.outputs.image_matrix }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

    - name: Discover production base images and enforce digest-pinning
      id: discover
      shell: pwsh
      run: ./.github/scripts/discover-base-images.ps1

  scan-images:
    # Build each production JIM image and scan it for CRITICAL/HIGH CVEs with a
    # published fix. Emits SARIF so findings are surfaced in the GitHub Security tab,
    # not just the Actions log. Catches vulnerabilities early, before a release tag
    # is created.
    #
    # The built image, not the base image, is the subject: it is what customers run,
    # and it alone carries the apt pins and the build-time apt-get upgrade (see any
    # production Dockerfile). Scanning the base image instead reported every Ubuntu
    # advisory Microsoft's rebuild had not yet caught up with, none of which the
    # shipped image still contained, and could not see the JIM layer at all. The
    # matrix comes from discover-base-images, so adding a new production Dockerfile
    # requires zero changes to this workflow: just add the
    # "# jim-compliance: production-image" directive to the new file.
    #
    # Each leg also starts the built image and waits for its startup log line, the smoke
    # test release.yml runs before it pushes, so an image that builds but cannot start
    # (a wrong ENTRYPOINT, a missing native library, a runtime the published output does not
    # match) fails the PR rather than the release.
    #
    # Named explicitly so the matrix's startup_log does not leak into the check names.
    name: scan-images (${{ matrix.dockerfile }}, ${{ matrix.image_name }})
    needs: discover-base-images
    runs-on: ${{ github.event_name == 'push' && 'self-hosted' || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write  # required to upload SARIF to code scanning

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-base-images.outputs.image_matrix) }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

    # The self-hosted runners share one home directory, so without this every job reads and writes the same
    # ~/.docker: `setup-buildx-action --use` in one job switches every runner onto its builder (and removes
    # it when that job ends, killing any build still using it), and the login action's `docker logout`
    # logs every runner out of the registry (#1773). A per-job copy keeps the host's settings and plugins
    # while keeping each job's changes to itself. The runner empties RUNNER_TEMP after every job.
    - name: Isolate Docker client config
      run: |
        DOCKER_CONFIG_DIR="$RUNNER_TEMP/docker-config"
        mkdir -p "$DOCKER_CONFIG_DIR"
        if [ -f "$HOME/.docker/config.json" ]; then cp "$HOME/.docker/config.json" "$DOCKER_CONFIG_DIR/"; fi
        if [ -d "$HOME/.docker/cli-plugins" ]; then ln -s "$HOME/.docker/cli-plugins" "$DOCKER_CONFIG_DIR/cli-plugins"; fi
        echo "DOCKER_CONFIG=$DOCKER_CONFIG_DIR" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

    # Same action, pins and cache scope as the release build, so a PR's build warms the
    # cache the release will use and vice versa. The image is loaded into the local
    # daemon for Trivy to read via --image-src docker; nothing is pushed. JIM.Web builds with its
    # OpenAPI generation stage, as the release does: that stage boots the app inside the image far
    # enough to walk every route and response type, so it fails on the faults nothing else here
    # sees (duplicate route parameters, ambiguous templates, reference cycles in the model graph;
    # dotnet build and the unit tests stay clean through all of them). #1238 shipped such a cycle
    # with every check green and no release image could be built. This leg is the required guard
    # for that now (through scan-base-images-summary); a separate openapi-document job did it
    # until the in-image stage ran on every PR, and to reproduce a failure without Docker, run
    # jim-openapi-generate (scripts/Generate-OpenApiDoc.ps1).
    # The base stage's apt-get upgrade has to run against the live noble archive, and served from
    # the cache that layer is replayed as it stood when it last ran (Dockerfile and digest
    # unchanged): the "upgraded" images carried fixes up to two weeks stale and Trivy reported 31
    # fixable MEDIUM CVEs a fresh build did not have. Today's date goes into the layer's cache key
    # as the APT_REFRESH build argument, so the upgrade runs afresh once a day and every layer
    # above it is rebuilt on the result. no-cache-filters=base was tried first and does not work:
    # BuildKit keys the final stage on the instruction chain rather than on the base stage's
    # output, so it matched the cache and the rebuilt base layer was discarded (#1705). The SDK
    # build stage is unaffected either way and still comes from the cache.
    - name: Date the apt upgrade layer
      id: apt_refresh
      run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

    - name: Build image
      id: build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        file: ${{ matrix.dockerfile }}
        load: true
        tags: ${{ matrix.image_name }}:scan
        build-args: |
          VERSION=scan
          APT_REFRESH=${{ steps.apt_refresh.outputs.date }}
        cache-from: type=gha,scope=${{ matrix.image_name }}
        cache-to: type=gha,scope=${{ matrix.image_name }},mode=max

    - name: Scan image for vulnerabilities
      id: trivy
      # Run Trivy from its pinned container image rather than via
      # aquasecurity/trivy-action + setup-trivy. The action path re-downloaded
      # the Trivy binary from the GitHub releases API on every run, which failed
      # intermittently on GitHub-hosted runners ("unable to find 'vX.Y.Z'"), and
      # the action wrapper independently exited 1 without writing a SARIF
      # (phantom failure). Both flakes blocked unrelated PRs at random. Calling
      # the pinned binary directly removes the release-API lookup entirely and
      # lets us own the exit code. See PR #520 and #800.
      #
      # The vuln-DB download is the one external dependency left on the hot path, so
      # it runs as its own retried phase before the scan, which then reads that DB
      # with --skip-db-update. Trivy's built-in repository fallback does not cover
      # every failure: on run 36450669448 mirror.gcr.io answered the manifest but
      # 404'd a layer, Trivy exited FATAL without trying the next repository, and
      # main went red on two of three images. GHCR is listed first because
      # github.token authenticates it (no anonymous rate limit); mirror.gcr.io
      # stays as the fallback.
      #
      # No severity filter on the scan: we emit every finding to the SARIF and
      # apply our own CVSS-based gate in the next step (more reliable than the
      # action's filter, and uses the same score GitHub Code Scanning shows).
      # ignore-unfixed stays on: no value blocking on CVEs with no upstream fix.
      #
      # The image tag is passed via env, not interpolated into the run script, to
      # avoid GitHub Actions expression-injection (flagged by CodeQL actions).
      env:
        # aquasec/trivy:0.70.0 pinned by digest (supply-chain governance).
        TRIVY_IMAGE: 'aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e'
        IMAGE_REF: ${{ matrix.image_name }}:scan
        GITHUB_TOKEN: ${{ github.token }}
        DB_REPOSITORIES: 'ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2'
      run: |
        CACHE_DIR="$RUNNER_TEMP/trivy-cache"
        mkdir -p "$CACHE_DIR"

        for attempt in 1 2 3; do
          # As the runner's own user, so the runner can empty RUNNER_TEMP afterwards.
          if docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$CACHE_DIR:/trivy-cache" \
            -e GITHUB_TOKEN \
            "$TRIVY_IMAGE" image \
            --cache-dir /trivy-cache \
            --db-repository "$DB_REPOSITORIES" \
            --no-progress \
            --download-db-only; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error title=Trivy DB download failed::Could not download the vulnerability DB after $attempt attempts."
            exit 1
          fi
          echo "::warning title=Trivy DB download failed::Attempt $attempt failed; retrying in $((attempt * 15))s."
          sleep $((attempt * 15))
        done

        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "$GITHUB_WORKSPACE:/workspace" \
          -v "$CACHE_DIR:/trivy-cache" \
          -w /workspace \
          -e TRIVY_IGNORE_UNFIXED=true \
          "$TRIVY_IMAGE" image \
          --cache-dir /trivy-cache \
          --cache-backend memory \
          --skip-db-update \
          --scanners vuln \
          --format sarif \
          --output trivy-results.sarif \
          --ignorefile .trivyignore \
          --image-src docker \
          --exit-code 0 \
          "$IMAGE_REF"

    # Keep the raw SARIF for two weeks. The Security tab is the only other copy, it is not
    # readable through the API from every environment, and the counts below cannot say which
    # CVEs they are; a finding that a local rebuild cannot reproduce is undiagnosable without it.
    - name: Upload Trivy SARIF as a workflow artifact
      if: always() && hashFiles('trivy-results.sarif') != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: trivy-sarif-${{ matrix.image_name }}
        path: trivy-results.sarif
        retention-days: 14

    - name: Fail build on fixable HIGH/CRITICAL Trivy findings
      shell: pwsh
      run: |
        if (-not (Test-Path 'trivy-results.sarif')) {
          Write-Error "Trivy did not produce a SARIF file."
          exit 1
        }

        $sarif = Get-Content 'trivy-results.sarif' -Raw | ConvertFrom-Json

        # Build a ruleId -> CVSS score map from the SARIF rules catalogue.
        # Trivy writes the CVSS base score to rule.properties.'security-severity'
        # as a decimal string (e.g. "7.5"). This is the same field GitHub Code
        # Scanning reads to classify alerts as low/medium/high/critical.
        $severityByRule = @{}
        foreach ($r in $sarif.runs) {
          foreach ($rule in $r.tool.driver.rules) {
            $score = 0.0
            $raw = $rule.properties.'security-severity'
            if ($raw) { [void][double]::TryParse($raw, [ref]$score) }
            $severityByRule[$rule.id] = $score
          }
        }

        # Walk results, classify by CVSS, and count only HIGH (>= 7.0) and
        # CRITICAL (>= 9.0). Also collect a sample for the log.
        $critical = 0
        $high     = 0
        $medium   = 0
        $low      = 0
        $blocking = @()
        foreach ($r in $sarif.runs) {
          foreach ($result in @($r.results)) {
            if (-not $result) { continue }
            $ruleId = $result.ruleId
            $score  = [double]$severityByRule[$ruleId]
            if ($score -ge 9.0) {
              $critical++
              $blocking += "$ruleId (CVSS $score)"
            } elseif ($score -ge 7.0) {
              $high++
              $blocking += "$ruleId (CVSS $score)"
            } elseif ($score -ge 4.0) {
              $medium++
            } else {
              $low++
            }
          }
        }

        Write-Host "Trivy findings for ${{ matrix.image_name }} (${{ matrix.dockerfile }}):"
        Write-Host "  CRITICAL: $critical"
        Write-Host "  HIGH:     $high"
        Write-Host "  MEDIUM:   $medium  (not blocking)"
        Write-Host "  LOW:      $low  (not blocking)"
        Write-Host ''

        $blockingCount = $critical + $high
        if ($blockingCount -gt 0) {
          Write-Host "Blocking CVEs (CVSS >= 7.0):"
          $blocking | Sort-Object -Unique | ForEach-Object { Write-Host "  $_" }
          Write-Host ''
          Write-Host 'Fixable CRITICAL/HIGH vulnerabilities found. Failing build.'
          Write-Host 'See the GitHub Security tab for details:'
          Write-Host '  https://github.com/TetronIO/JIM/security/code-scanning'
          exit 1
        }
        Write-Host 'No fixable CRITICAL/HIGH vulnerabilities found.'

    - name: Upload Trivy scan results to GitHub code scanning
      if: always() && hashFiles('trivy-results.sarif') != ''
      uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52  # v3.38.2
      with:
        sarif_file: trivy-results.sarif
        # Category is keyed by the JIM image name (stable across base image
        # digest bumps and Dockerfile edits), so fixed findings close on the
        # next upload rather than sitting orphaned under a category that is
        # never uploaded again. See discover-base-images.ps1.
        category: trivy-image-${{ matrix.image_name }}

    # Start the image just built and wait for the line the service logs first ("Starting JIM.Web" and
    # so on, from the matrix), as release.yml's smoke test does before it pushes. Dummy database
    # settings are enough: each service logs that line before it connects, then fails to connect,
    # which is expected here. Runs whether or not the CVE gate passed, so the two signals stay
    # independent. The container name is unique per image and run because push runs share one
    # Docker daemon on the self-hosted host, and the trap removes it however the step ends. The
    # matrix values reach the script through env, never interpolated into it.
    - name: Smoke test the image
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      env:
        IMAGE: ${{ matrix.image_name }}:scan
        STARTUP_LOG: ${{ matrix.startup_log }}
        NAME: smoke-test-${{ matrix.image_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        trap 'docker rm -f "$NAME" > /dev/null 2>&1 || true' EXIT
        docker run -d --name "$NAME" \
          -e JIM_DB_HOSTNAME=localhost \
          -e JIM_DB_NAME=jim \
          -e JIM_DB_USERNAME=jim \
          -e JIM_DB_PASSWORD=dummy \
          -e JIM_LOG_LEVEL=Information \
          -e JIM_LOG_PATH=/tmp/jim-logs \
          "$IMAGE" > /dev/null

        # Up to 30 seconds (a cold start on a hosted runner is slower than on the release host),
        # but no longer than the container lives: one that has exited without the line never will.
        for _ in $(seq 1 30); do
          if docker logs "$NAME" 2>&1 | grep -qF "$STARTUP_LOG"; then
            echo "Startup log found: $STARTUP_LOG"
            exit 0
          fi
          if [ "$(docker inspect --format '{{.State.Running}}' "$NAME")" != "true" ]; then
            break
          fi
          sleep 1
        done

        # Once more, in case the line landed between the last check and the container exiting.
        if docker logs "$NAME" 2>&1 | grep -qF "$STARTUP_LOG"; then
          echo "Startup log found: $STARTUP_LOG"
          exit 0
        fi

        echo "::error title=Image did not start::$IMAGE did not log \"$STARTUP_LOG\". Its output follows."
        docker logs "$NAME" 2>&1 | tail -n 100
        exit 1

  scan-base-images-summary:
    # Stable-name gate for the dynamic scan-images matrix, providing the single
    # check name the branch protection ruleset requires. The name predates the
    # move from scanning base images to scanning the built JIM images and is
    # kept because the ruleset names it; renaming it here without changing the
    # ruleset would leave every PR waiting on a check that never reports.
    if: always()
    needs: [discover-base-images, scan-images]
    runs-on: ${{ github.event_name == 'push' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
    - name: Check matrix results
      run: |
        if [ "${{ needs.discover-base-images.result }}" != "success" ]; then
          echo "discover-base-images failed or was cancelled"
          exit 1
        fi
        if [ "${{ needs.scan-images.result }}" != "success" ]; then
          echo "One or more scan-images matrix legs failed"
          exit 1
        fi
        echo "All image scans passed"

  deployment-boot:
    # Installs JIM the way a customer does, three times over: from a release bundle built from this commit,
    # with the bundle's own setup.sh, offline, on Docker, on rootful Podman and on rootless Podman. Each leg
    # then checks what the customer would: JIM ready over HTTPS with the certificate the installer created,
    # every container's own health check passing, and data kept through a stop and start; on Docker, also the
    # documented key backup and restore, run as the page gives them, fetching no image
    # (test/ci/deployment/Invoke-DeploymentBoot.ps1). Last, it compares what the two runtimes actually run,
    # so the compose files and the pod files cannot drift apart unnoticed (Compare-RuntimeParity.ps1). This
    # is the only check that boots the production deployment of either runtime.
    #
    # A required check on main since 2026-09-29, after 40 green runs and none failed (D6 of
    # engineering/plans/doing/PODMAN_SUPPORT.md). It pulls Keycloak from quay.io and PostgreSQL from Docker
    # Hub on every run, so an outage at either blocks merges while it lasts.
    #
    # Always on a GitHub-hosted runner, pushes to main included: a fresh VM with systemd, Docker and Podman,
    # where the check can create an account, change a sysctl and take port 443. The self-hosted runners are
    # not assumed to allow any of that.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The builds' own post-job summaries and the builder's removal would reach for the Buildx builder
    # after Docker has moved to its classic image store, which cannot see it; on a runner thrown away after
    # the job, neither is worth anything.
    env:
      DOCKER_BUILD_SUMMARY: false
      DOCKER_BUILD_RECORD_UPLOAD: false

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

    # Three JIM installations, their images twice more in Podman's storage, and the bundle: more than the
    # runner's free disk. The Android SDK alone is about 9 GB, and nothing here uses it.
    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift
        df -h /

    # The bundle's PostgreSQL archive must carry the registry manifest its digest pin needs, or the image
    # would not resolve offline, and only Docker's containerd image store saves it: Build-ReleaseBundle.ps1
    # refuses a bundle without it. The Docker leg installs on the classic store all the same (below).
    - name: Use Docker's containerd image store
      run: |
        config=/etc/docker/daemon.json
        current=$(sudo cat "$config" 2>/dev/null || echo '{}')
        echo "$current" | jq '.features["containerd-snapshotter"] = true' | sudo tee "$config" > /dev/null
        sudo systemctl restart docker
        docker info -f '{{.DriverStatus}}'

    # GitHub's image sets the runner account's own XDG folders for every account (XDG_CONFIG_HOME=/home/runner/.config,
    # XDG_RUNTIME_DIR=/run/user/1001), which the rootless leg's jim account's systemd manager would inherit: Podman's
    # Quadlet generator would look for the account's units in the runner's folder, and Podman would refuse a runtime
    # folder the account does not own. No real host points every account at one account's folders, so this is
    # undone here rather than worked around in the installer.
    - name: Stop pointing every account at the runner's own folders
      run: |
        for file in /etc/environment /etc/environment.d/*.conf /etc/security/pam_env.conf; do
          if sudo grep -qs '^XDG_' "$file"; then
            echo "Removing from $file: $(sudo grep '^XDG_' "$file" | cut -d= -f1 | tr '\n' ' ')"
            sudo sed -i '/^XDG_/d' "$file"
          fi
        done

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      with:
        cleanup: false

    # Built as scan-images builds them, with the same build arguments, so that they come from the cache
    # scan-images keeps; read-only here, since scan-images writes it. The tag is the bundle's version.
    - name: Date the apt upgrade layer
      id: apt_refresh
      run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

    - name: Build jim-web
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        file: src/JIM.Web/Dockerfile
        load: true
        tags: ghcr.io/tetronio/jim-web:ci
        build-args: |
          VERSION=scan
          APT_REFRESH=${{ steps.apt_refresh.outputs.date }}
        cache-from: type=gha,scope=jim-web

    - name: Build jim-worker
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        file: src/JIM.Worker/Dockerfile
        load: true
        tags: ghcr.io/tetronio/jim-worker:ci
        build-args: |
          VERSION=scan
          APT_REFRESH=${{ steps.apt_refresh.outputs.date }}
        cache-from: type=gha,scope=jim-worker

    - name: Build jim-scheduler
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        file: src/JIM.Scheduler/Dockerfile
        load: true
        tags: ghcr.io/tetronio/jim-scheduler:ci
        build-args: |
          VERSION=scan
          APT_REFRESH=${{ steps.apt_refresh.outputs.date }}
        cache-from: type=gha,scope=jim-scheduler

    - name: Build the release bundle
      shell: pwsh
      run: ./scripts/Build-ReleaseBundle.ps1 -Version ci -SkipImageBuild -SkipArchive -OutputPath "$env:RUNNER_TEMP/bundle"

    # The Docker leg installs on Docker's classic image store: the default wherever Docker predates the
    # containerd store, and the harder one for an air-gapped install, since loading an image drops the
    # registry digest the compose file pins PostgreSQL by (#1854). The images built above stay in the
    # containerd store, out of the classic store's sight, so the leg can run only what the bundle carries.
    # Before the identity provider, which a restart of Docker would stop.
    - name: Switch Docker back to its classic image store
      run: |
        docker image prune -af > /dev/null
        config=/etc/docker/daemon.json
        sudo jq '.features["containerd-snapshotter"] = false' "$config" | sudo tee "$config.new" > /dev/null
        sudo mv "$config.new" "$config"
        sudo systemctl restart docker
        driver=$(docker info -f '{{.Driver}}')
        echo "Storage driver: $driver"
        if [ "$driver" != overlay2 ]; then
          echo "::error::Docker is not on its classic image store (storage driver $driver)"
          exit 1
        fi

    - name: Start the test identity provider
      id: idp
      shell: pwsh
      run: |
        $authority = ./test/ci/deployment/Start-TestIdentityProvider.ps1
        "JIM_CI_AUTHORITY=$authority" >> $env:GITHUB_ENV
        "## Deployment boot" >> $env:GITHUB_STEP_SUMMARY

    # One leg at a time, since each takes port 443; each stops JIM when it finishes, pass or fail. A failed
    # leg does not stop the next, so that one run reports every runtime.
    - name: Docker
      shell: pwsh
      run: ./test/ci/deployment/Invoke-DeploymentBoot.ps1 -BundlePath "$env:RUNNER_TEMP/bundle/jim-release-ci" -Runtime docker -Authority $env:JIM_CI_AUTHORITY -OutputPath "$env:RUNNER_TEMP/deployment-boot"

    - name: Podman, rootful
      if: ${{ !cancelled() && steps.idp.outcome == 'success' }}
      shell: pwsh
      run: ./test/ci/deployment/Invoke-DeploymentBoot.ps1 -BundlePath "$env:RUNNER_TEMP/bundle/jim-release-ci" -Runtime podman -Authority $env:JIM_CI_AUTHORITY -OutputPath "$env:RUNNER_TEMP/deployment-boot"

    - name: Podman, rootless
      if: ${{ !cancelled() && steps.idp.outcome == 'success' }}
      shell: pwsh
      run: ./test/ci/deployment/Invoke-DeploymentBoot.ps1 -BundlePath "$env:RUNNER_TEMP/bundle/jim-release-ci" -Runtime podman -Rootless -Authority $env:JIM_CI_AUTHORITY -OutputPath "$env:RUNNER_TEMP/deployment-boot"

    - name: Compare what the runtimes run
      if: ${{ !cancelled() && steps.idp.outcome == 'success' }}
      shell: pwsh
      run: |
        $out = "$env:RUNNER_TEMP/deployment-boot"
        ./test/ci/deployment/Compare-RuntimeParity.ps1 -Reference "$out/docker.inspect.json" -Candidate "$out/podman-rootful.inspect.json", "$out/podman-rootless.inspect.json"

    # The installers' logs, each leg's inspect output and, for a failed leg, its containers' logs.
    - name: Upload the deployment-boot output
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: deployment-boot
        path: ${{ runner.temp }}/deployment-boot
        retention-days: 14
