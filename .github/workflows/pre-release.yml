# Pre-release integration run: the full pre-release regression (Run-IntegrationTests.ps1 -PreRelease -Parallel),
# every implemented scenario against Samba AD (Medium), OpenLDAP (Large) and 389 Directory Server (Large), the three
# passes side by side, on the self-hosted pre-release runner, and a `jim-pre-release` commit status on the SHA it
# tested.
#
# What it does: pauses the host's other runners (the suite needs the host's Docker to itself, see below), runs the
# suite with -ContinueOnFailure so one red scenario does not hide the others, writes a per-directory summary to the
# job summary, uploads the regression reports and logs, posts the commit status, tears the stacks down and resumes
# the other runners. The last four always run, even after a failure.
#
# A correctness gate, not a performance run: the passes share the host, so their timings are not nominal, and the
# runner never streams a parallel pass to JIM-Bench. Performance data comes from serial runs elsewhere. About 1h 45m,
# plus about 15 minutes on a cold host, which builds the directory snapshots and pulls the Oracle image (13.6 GB).
#
# Triggers: a push to main that changes VERSION, and workflow_dispatch. NEVER pull_request. Only a release pull
# request changes VERSION, so merging one starts this run on the merge commit, which is the commit the release tags
# and the one the release gate checks; nothing else may merge to main before the tag (engineering/RELEASE_PROCESS.md).
# Dispatch it to re-run after a fix, or at any other time; a dispatch runs the suite alone unless its screenshots box
# is ticked (see jim-screenshots). Split-trust runner model (see ci.yml): a pull_request runs
# code from anyone's fork, and this runner pauses its host's other runners and runs privileged containers, so fork
# code must never reach it:
#   - a push to main is merged code, and a dispatch needs write access to this repository;
#   - the runner (`<host>-prerelease`, label `jim-prerelease`) is alone in a DEDICATED runner group named
#     `jim-prerelease`, with repository access to TetronIO/JIM only and a workflow allowlist of exactly this file at
#     refs/heads/main, so even a branch that edits this workflow cannot reach the runner. It is not in
#     `tetron-trusted`: a runner carrying the default labels there would be offered ordinary ci.yml push jobs.
#     Set the allowlist once, with an account holding admin:org:
#
#       GROUP=$(gh api orgs/TetronIO/actions/runner-groups --jq '.runner_groups[] | select(.name == "jim-prerelease") | .id')
#       jq -n '{restricted_to_workflows: true, selected_workflows: ["TetronIO/JIM/.github/workflows/pre-release.yml@refs/heads/main"]}' \
#         | gh api -X PATCH "orgs/TetronIO/actions/runner-groups/$GROUP" --input - --jq '.selected_workflows'
#
# The host: the runner and the pause tool are set up from TetronIO/ci-runners (docs/rebuild.md, "The pre-release
# runner"). The suite assumes it owns the host's Docker: after each pass it deletes every image it did not build and
# wipes the build cache, and it publishes fixed host ports (5200, 5300, 5400, 5432 to 5434, 8180). CI jobs running
# beside it would lose their images or collide on 5432, so the first step runs
# `sudo -n /usr/local/sbin/ci-runner-pause pause <this runner>`: it stops every other runner on the host, each one only
# while it is idle (never cancelling a job), and GitHub sends their jobs to the organisation's other runners or queues
# them. The last step resumes them, and a watchdog on the host resumes them anyway if this job is cancelled or dies
# before it gets there.
#
# Configuration: the suite needs none (its test credentials are throwaway and built in). The jim-screenshots job, which
# follows a passing suite with the release's screenshots when a release is being prepared (see that job), uses the jim-automation app's JIM_AUTOMATION_*
# secrets to open its pull requests on junctional.io and tetron.io.
#
# The release gate: release.yml's jim-pre-release-gate job and the /release skill require a `success` status from this
# workflow on the SHA being tagged (scripts/Test-PreReleaseGate.ps1), with no override, once the repository variable
# JIM_PRE_RELEASE_GATE_ENFORCED is `true`; until then a release carries a warning instead.

name: jim-pre-release

on:
  push:
    branches: [ "main" ]
    paths: [ "VERSION" ]
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Capture the release's screenshots too, and open their pull requests on junctional.io and tetron.io. Only when preparing a release."
        type: boolean
        default: false

permissions:
  contents: read
  statuses: write

jobs:
  jim-pre-release:
    name: jim-pre-release
    runs-on: [self-hosted, jim-prerelease]
    # About 1h 45m, plus about 15 minutes on a cold host; the margin covers a slow lane and the clean-up.
    timeout-minutes: 240
    # One run at a time: the suite uses fixed container names and ports, so a second run would tear the first down.
    # Never cancelled by a newer dispatch, which waits its turn instead.
    concurrency:
      group: jim-pre-release
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    # Read by jim-screenshots, which runs only when this says so.
    outputs:
      screenshots: ${{ steps.screenshots.outputs.capture }}

    steps:
      # The JIM worker container (UID 1654) writes its logs into the workspace through a bind mount, so a previous
      # run can leave files this runner's user cannot delete, and checkout's clean would then fail. Hand them back
      # first, through Docker (the runner's user is in the docker group; it has no general sudo).
      - name: Hand back files a previous run's containers wrote
        shell: bash
        run: |
          if [ -d "$GITHUB_WORKSPACE/test/integration/results" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE/test/integration/results:/results" busybox:1.37.0 \
              chown -R "$(id -u):$(id -g)" /results
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # Whether jim-screenshots runs after the suite. A push here is a release pull request merging (only one changes
      # VERSION), so it captures; a dispatch captures only when its screenshots box is ticked. Either way, never when
      # VERSION's tag already exists on another commit: that version has shipped, so its images would show unreleased
      # code under an old version's name, and the site pull requests would merge at once, finding the release already
      # out. A tag on this very commit is the release being cut while the suite ran, which still captures.
      - name: Decide whether to capture the screenshots
        id: screenshots
        env:
          REQUESTED: ${{ github.event_name == 'push' || inputs.screenshots }}
        run: |
          $version = 'v' + (Get-Content -LiteralPath VERSION -Raw).Trim()
          $capture = $env:REQUESTED -eq 'true'
          if (-not $capture) {
            Write-Host "Screenshots not requested; tick 'screenshots' when dispatching to capture them for a release."
          }
          else {
            $refs = @(git ls-remote --tags origin "refs/tags/$version" "refs/tags/$version^{}")
            if ($LASTEXITCODE -ne 0) { throw "Could not list the tags on origin (git exit code $LASTEXITCODE)." }
            # An annotated tag lists twice; its ^{} line is the commit it points at.
            $line = @($refs | Where-Object { $_ -like "*`trefs/tags/$version^{}" }) + @($refs) | Select-Object -First 1
            $tagged = if ($line) { ($line -split "`t")[0] } else { $null }
            if ($tagged -and $tagged -ne $env:GITHUB_SHA) {
              Write-Host "::warning::$version is already tagged on $tagged, not this commit; no screenshots are captured. Bump VERSION in a release pull request first."
              $capture = $false
            }
          }
          "capture=$($capture.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # See the header: the suite needs the host's Docker to itself. Waits for each other runner's current job to
      # finish (up to an hour), and fails rather than run beside a job it could not wait out.
      - name: Pause this host's other runners
        run: |
          sudo -n /usr/local/sbin/ci-runner-pause pause "$env:RUNNER_NAME"
          exit $LASTEXITCODE

      # The integration runner expects a .env in the repository root (it is gitignored, so a fresh checkout has
      # none). The stack is throwaway: its database password is generated for this run and never reused.
      - name: Create the stack's .env
        run: |
          $bytes = New-Object byte[] 24
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $password = [Convert]::ToBase64String($bytes).Replace('+', 'A').Replace('/', 'B').Replace('=', '')
          $text = (Get-Content -LiteralPath .env.example -Raw) -replace '(?m)^JIM_DB_PASSWORD=.*$', "JIM_DB_PASSWORD=$password"
          Set-Content -LiteralPath .env -Value $text -NoNewline

      # The suite. -ContinueOnFailure so one red scenario does not hide the others: the point is the full list.
      - name: Run the pre-release suite
        id: suite
        run: |
          pwsh -File ./test/integration/Run-IntegrationTests.ps1 -PreRelease -Parallel -ContinueOnFailure
          exit $LASTEXITCODE

      # What the run left, condensed: one row per directory pass from its regression report
      # (full-regression-<DirectoryType>-*.json; checkout's clean removed any earlier run's), into the job summary and
      # the one-line description of the commit status.
      - name: Summarise the run
        id: summary
        if: ${{ always() }}
        env:
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: |
          $files = @(Get-ChildItem -Path 'test/integration/results' -Filter 'full-regression*.json' -File -ErrorAction SilentlyContinue | Sort-Object Name)
          $rows = @()
          $passed = 0; $failed = 0; $skipped = 0
          $failedNames = @()
          foreach ($file in $files) {
            $report = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json
            $scenarios = @($report.Scenarios)
            $p = @($scenarios | Where-Object { $_.Success -and -not $_.Skipped }).Count
            $s = @($scenarios | Where-Object { $_.Skipped }).Count
            $f = @($scenarios | Where-Object { -not $_.Success -and -not $_.Skipped }).Count
            $passed += $p; $failed += $f; $skipped += $s
            $failedNames += @($scenarios | Where-Object { -not $_.Success -and -not $_.Skipped } | ForEach-Object { "$($report.DirectoryType): $($_.Name)" })
            $rows += "| $($report.DirectoryType) | $($report.Template) | $p | $f | $s |"
          }
          $total = $passed + $failed
          if ($files.Count -eq 0) {
            $description = 'the run stopped before any directory pass reported'
          }
          else {
            $description = "$passed/$total scenario runs passed across $($files.Count) directory passes"
            if ($skipped -gt 0) { $description += "; $skipped skipped" }
          }
          if ($description.Length -gt 140) { $description = $description.Substring(0, 137) + '...' }
          "description=$description" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $lines = @('### Pre-release integration run', '', "**$description**", '')
          if ($rows.Count -gt 0) {
            $lines += '| Directory | Template | Passed | Failed | Skipped |'
            $lines += '|---|---|---|---|---|'
            $lines += $rows
          }
          if ($failedNames.Count -gt 0) {
            $lines += ''
            $lines += 'Failed scenarios: ' + (($failedNames | ForEach-Object { "``$_``" }) -join ', ')
          }
          $lines += ''
          $lines += "Suite: $env:SUITE_OUTCOME."
          $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # The regression reports (full-regression-*.json and the combined parallel-lanes-*.json), the lane and
      # scenario transcripts and worker logs (logs/), and the performance files. The docker stats and events
      # samplers are big and only useful for performance work.
      - name: Upload the run's artefacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: jim-pre-release-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test/integration/results/
            !test/integration/results/README.md
            !test/integration/results/docker-stats-*
            !test/integration/results/docker-events-*
          if-no-files-found: warn
          retention-days: 30

      # The commit status a release gate can read. Posted on the SHA that was tested (a dispatch checks out
      # github.sha), from the suite's outcome: success only when every scenario passed. A cancelled run posts nothing,
      # so it can neither open a gate nor close it on a commit it did not finish testing.
      - name: Post the jim-pre-release commit status
        if: ${{ always() && job.status != 'cancelled' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
          SUMMARY_DESCRIPTION: ${{ steps.summary.outputs.description }}
        run: |
          # failure: the suite ran and something failed; error: the run never got as far as running it.
          $state = switch ($env:SUITE_OUTCOME) { 'success' { 'success' } 'failure' { 'failure' } default { 'error' } }
          $description = $env:SUMMARY_DESCRIPTION
          if (-not $description) { $description = 'the run stopped before the suite ran' }
          gh api "repos/$env:REPOSITORY/statuses/$env:TESTED_SHA" -f state="$state" -f context='jim-pre-release' -f description="$description" -f target_url="$env:RUN_URL"
          exit $LASTEXITCODE

      # The runner is not ephemeral. The suite removes a lane that passed and leaves a failed one up for diagnosis;
      # its logs are in the artefacts by now, so remove every lane's stack. Scenario 016's database containers are kept between runs by design. Then hand back the files the
      # worker container wrote, so the next checkout can clean the workspace.
      - name: Tear down the stacks
        if: ${{ always() }}
        run: |
          . ./test/integration/utils/Invoke-IntegrationLanes.ps1
          foreach ($lane in @('SambaAD', 'OpenLDAP', 'DirectoryServer389')) {
            try { Remove-IntegrationLaneStack -Name $lane -RepoRoot (Get-Location) }
            catch { Write-Host "::warning::Removing the $lane stack failed: $_" }
          }
          if (Test-Path -LiteralPath 'test/integration/results') {
            docker run --rm -v "$(Resolve-Path 'test/integration/results'):/results" busybox:1.37.0 chown -R "$(id -u):$(id -g)" /results
          }
          exit 0

      # Last, and always, so the host's other runners come back however this job ended. The host's watchdog
      # resumes them too if the job dies before this step.
      - name: Resume this host's other runners
        if: ${{ always() }}
        run: |
          sudo -n /usr/local/sbin/ci-runner-pause resume
          exit $LASTEXITCODE

  # The release's screenshots (#582): once the suite has passed on the commit the release will tag, the same runner
  # loads integration Scenario 8 at Scale100k50Groups, captures every image in scripts/screenshots/manifest.json with
  # the portal in Production mode, keeps the whole library as an artefact, and opens a pull request on junctional.io
  # with the images its product tour shows (scripts/screenshots/Publish-TourScreenshots.ps1), and one on tetron.io
  # replacing the JIM screenshot in its homepage hero (scripts/screenshots/Publish-TetronScreenshots.ps1). No one
  # reviews them: the capture refuses blank images and dark and light pairs in the same theme, junctional.io is built
  # with the new images before anything is committed, and each pull request merges once its checks pass and the
  # release is published (release.yml's publish-screenshots job, or this job if the release came out first).
  #
  # Only when a release is being prepared: after a release pull request merges, or a dispatch with screenshots ticked,
  # and never for a version already tagged on another commit (the suite job's "Decide whether to capture the
  # screenshots" step). A plain dispatch runs the suite alone.
  #
  # A job here rather than a workflow of its own, because the jim-prerelease runner group admits exactly this file. It
  # cannot hold up a release: the gate reads the jim-pre-release commit status, which the job above has already posted.
  #
  # The host, once (TetronIO/ci-runners): Node.js 22 and Chromium's system libraries, from
  # scripts/toolchain/install-playwright-for-runner.sh (re-run it with the new pin when PLAYWRIGHT_MCP_VERSION in
  # .devcontainer/setup.sh moves); the 20+ GB the Scale100k50Groups template needs; the Scale100k50Groups OpenLDAP
  # snapshot, which the first run builds and keeps. The jim-automation app needs Contents and Pull requests write on
  # junctional.io and tetron.io.
  jim-screenshots:
    name: jim-screenshots
    needs: jim-pre-release
    # The suite job's decision: a release pull request merging, or a dispatch with screenshots ticked, on a version
    # not yet tagged elsewhere.
    if: ${{ needs.jim-pre-release.outputs.screenshots == 'true' }}
    runs-on: [self-hosted, jim-prerelease]
    # Reads the repository; junctional.io is reached with the jim-automation app's own token, minted below.
    permissions:
      contents: read
    # Scenario 8 at Scale100k50Groups, the rebuild at the release version, and about four minutes of capture.
    timeout-minutes: 300
    # The host's Docker is this job's alone, as for the suite: a new pre-release run waits for it.
    concurrency:
      group: jim-pre-release
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Hand back files a previous run's containers wrote
        shell: bash
        run: |
          if [ -d "$GITHUB_WORKSPACE/test/integration/results" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE/test/integration/results:/results" busybox:1.37.0 \
              chown -R "$(id -u):$(id -g)" /results
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Pause this host's other runners
        run: |
          sudo -n /usr/local/sbin/ci-runner-pause pause "$env:RUNNER_NAME"
          exit $LASTEXITCODE

      - name: Create the stack's .env
        run: |
          $bytes = New-Object byte[] 24
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $password = [Convert]::ToBase64String($bytes).Replace('+', 'A').Replace('/', 'B').Replace('=', '')
          $text = (Get-Content -LiteralPath .env.example -Raw) -replace '(?m)^JIM_DB_PASSWORD=.*$', "JIM_DB_PASSWORD=$password"
          Set-Content -LiteralPath .env -Value $text -NoNewline

      # The browser the capture drives: the @playwright/mcp version .devcontainer/setup.sh pins (and tooling-pin-check
      # watches), so CI captures with the same Playwright and Chromium a developer does. Install scripts are not run;
      # Chromium comes from Playwright's own installer, kept in the runner's tool cache between runs.
      - name: Install the capture's browser
        run: |
          $pin = (Select-String -LiteralPath .devcontainer/setup.sh -Pattern '^PLAYWRIGHT_MCP_VERSION="([^"]+)"').Matches[0].Groups[1].Value
          $prefix = Join-Path $env:RUNNER_TEMP 'playwright'
          npm install --prefix $prefix --ignore-scripts --no-audit --no-fund "@playwright/mcp@$pin"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $core = @(
            (Join-Path $prefix 'node_modules' '@playwright' 'mcp' 'node_modules' 'playwright-core'),
            (Join-Path $prefix 'node_modules' 'playwright-core')
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $core) { throw "No playwright-core under $prefix after installing @playwright/mcp@$pin." }
          $browsers = Join-Path $env:RUNNER_TOOL_CACHE 'ms-playwright'
          $env:PLAYWRIGHT_BROWSERS_PATH = $browsers
          node (Join-Path $core 'cli.js') install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "JIM_PLAYWRIGHT_MODULE=$core" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PLAYWRIGHT_BROWSERS_PATH=$browsers" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Capture the screenshots
        id: capture
        run: |
          $version = 'v' + (Get-Content -LiteralPath VERSION -Raw).Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          pwsh -File ./scripts/Capture-Screenshots.ps1 -Version $version -PrepareData -OutputPath artifacts/screenshots
          exit $LASTEXITCODE

      # The whole library, including the images not on the sites; both sites' pull requests link to it.
      - name: Upload the screenshots
        if: ${{ always() && steps.capture.outputs.version != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: jim-screenshots-${{ steps.capture.outputs.version }}-${{ github.run_attempt }}
          path: artifacts/screenshots/
          if-no-files-found: warn
          retention-days: 90

      # A prerelease's screenshots stay in the artefact; the site shows releases only, as notify-site in release.yml.
      - name: Mint a junctional.io token
        id: site-token
        if: ${{ success() && !contains(steps.capture.outputs.version, '-') }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ secrets.JIM_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.JIM_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: junctional.io

      - name: Check out junctional.io
        if: ${{ steps.site-token.outcome == 'success' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/junctional.io
          token: ${{ steps.site-token.outputs.token }}
          path: junctional.io
          persist-credentials: false

      # No one reviews the pull request: the capture refused blank images and pairs in the wrong theme, -Build refuses
      # images the site will not build with, and release.yml's publish-screenshots job merges it once the release is
      # published. If the release came out while this job was capturing, -MergeWhenReleased merges it here instead.
      - name: Open the junctional.io pull request
        if: ${{ steps.site-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.site-token.outputs.token }}
          JIM_RELEASE_TOKEN: ${{ github.token }}
          VERSION_FOLDER: ${{ steps.capture.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pwsh -File ./scripts/screenshots/Publish-TourScreenshots.ps1 -ScreenshotPath "artifacts/screenshots/$env:VERSION_FOLDER" `
            -Version $env:VERSION_FOLDER -SitePath junctional.io -Repository "$env:GITHUB_REPOSITORY_OWNER/junctional.io" -RunUrl $env:RUN_URL `
            -Build -MergeWhenReleased
          exit $LASTEXITCODE

      # tetron.io's homepage hero shows JIM's home page. Its own token and steps, run whether or not junctional.io's
      # succeeded, so one site's failure does not keep the other's screenshots back (the job still fails).
      - name: Mint a tetron.io token
        id: tetron-token
        if: ${{ !cancelled() && steps.capture.outcome == 'success' && !contains(steps.capture.outputs.version, '-') }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ secrets.JIM_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.JIM_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: tetron.io

      - name: Check out tetron.io
        if: ${{ !cancelled() && steps.tetron-token.outcome == 'success' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/tetron.io
          token: ${{ steps.tetron-token.outputs.token }}
          path: tetron.io
          persist-credentials: false

      # Merged the same way; its own check (the Azure Static Web Apps preview) builds the site with the new image.
      - name: Open the tetron.io pull request
        if: ${{ !cancelled() && steps.tetron-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.tetron-token.outputs.token }}
          JIM_RELEASE_TOKEN: ${{ github.token }}
          VERSION_FOLDER: ${{ steps.capture.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pwsh -File ./scripts/screenshots/Publish-TetronScreenshots.ps1 -ScreenshotPath "artifacts/screenshots/$env:VERSION_FOLDER" `
            -Version $env:VERSION_FOLDER -SitePath tetron.io -Repository "$env:GITHUB_REPOSITORY_OWNER/tetron.io" -RunUrl $env:RUN_URL `
            -MergeWhenReleased
          exit $LASTEXITCODE

      # A serial run's stack carries the SambaAD lane's names (the serial defaults), whatever directory it used.
      - name: Tear down the stack
        if: ${{ always() }}
        run: |
          . ./test/integration/utils/Invoke-IntegrationLanes.ps1
          try { Remove-IntegrationLaneStack -Name 'SambaAD' -RepoRoot (Get-Location) }
          catch { Write-Host "::warning::Removing the stack failed: $_" }
          if (Test-Path -LiteralPath 'test/integration/results') {
            docker run --rm -v "$(Resolve-Path 'test/integration/results'):/results" busybox:1.37.0 chown -R "$(id -u):$(id -g)" /results
          }
          exit 0

      - name: Resume this host's other runners
        if: ${{ always() }}
        run: |
          sudo -n /usr/local/sbin/ci-runner-pause resume
          exit $LASTEXITCODE
