# Pin the Compose project name so it stays 'jim' regardless of this file's
# location. Previously inherited from the repository-root directory basename;
# now that the file lives under .devcontainer/, the explicit name preserves the
# project namespace (shared with the full stack in docker-compose.yml) and
# avoids spurious orphan-container warnings.
name: jim

services:
  jim.database:
    container_name: JIM.Database
    # The PostgreSQL pinned in docker-compose.yml, which Dependabot maintains, so the dev database runs what customers
    # run. jim-db sets JIM_DEV_DB_IMAGE from that pin (scripts/Get-PostgresImageReference.ps1); a second pin here went
    # unwatched and fell three releases behind (#2075).
    image: ${JIM_DEV_DB_IMAGE:?set by jim-db from the pin in docker-compose.yml; start the database with jim-db}
    restart: always
    # shm_size must be >= shared_buffers - see docker-compose.yml for sizing guidance
    shm_size: '512mb'
    # Align max_connections with the full Docker stack (docker-compose.yml) so that
    # native development (jim-db + jim-web) and integration tests have the same limits.
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c max_connections=200
    volumes:
      - jim-db-volume:/var/lib/postgresql
    environment:
      - POSTGRES_USER=jim
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=jim
    ports:
      - "5432:5432"

volumes:
  jim-db-volume:
    name: jim-db-volume
