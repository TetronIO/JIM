    <rect class="jimdg-system" x="485" y="410" width="190" height="64" rx="8"/>
    <text class="jimdg-system-name" x="580" y="438">Enterprise Databases</text>
    <text class="jimdg-system-sub" x="580" y="459">SQL Server · Oracle</text>
