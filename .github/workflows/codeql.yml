# CodeQL static analysis - scans for security vulnerabilities and code quality issues
# Replaces GitHub's default CodeQL setup to produce a single predictable workflow run
# with stable check names for the branch protection ruleset.
#
# Languages: actions (GitHub Actions workflows), csharp, javascript-typescript

name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'actions', 'csharp', 'javascript-typescript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

    - name: Initialize CodeQL
      uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3  # v3.37.4
      with:
        languages: ${{ matrix.language }}
        config-file: ./.github/codeql/codeql-config.yml

    - name: Autobuild
      uses: github/codeql-action/autobuild@a2983b8bed1923f44751c5c43237f479442827b3  # v3.37.4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@a2983b8bed1923f44751c5c43237f479442827b3  # v3.37.4
      with:
        category: "/language:${{ matrix.language }}"
