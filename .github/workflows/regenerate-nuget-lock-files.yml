# Regenerates NuGet packages.lock.json files on Dependabot NuGet PRs.
#
# Why this exists: Dependabot does not reliably regenerate packages.lock.json
# across project references when it bumps a version in a .csproj
# (dependabot-core#12318, dependabot-core#10863). JIM enforces locked-mode
# restore in CI (Directory.Build.props sets RestoreLockedMode when CI=true; see
# engineering/DEPENDENCY_PINNING.md), so without this workflow every Dependabot
# NuGet PR would fail restore the moment its csproj bump diverges from the
# committed lock files.
#
# Expected transient red: the FIRST CI run triggered by a Dependabot push can
# fail locked-mode restore (the lock files have not caught up yet). This
# workflow then regenerates and pushes the lock files to the same branch, which
# (because the push is authored by the jim-automation GitHub App, not
# Dependabot) re-triggers CI on the new head; that second run is green. Do not
# treat the first failure as a real build break; check whether this workflow
# has since pushed a "regenerate NuGet lock files" commit before investigating.
#
# Why pull_request_target and not push: a workflow triggered by a Dependabot
# `push` (or `pull_request`) runs in the Dependabot secret scope. GitHub Actions
# secrets are simply not available there, so `secrets.JIM_AUTOMATION_APP_ID`
# resolved to an empty string and every run died at the token step with
# "The 'client-id' (or deprecated 'app-id') input must be set to a non-empty
# string". The workflow had therefore never regenerated a single lock file. Of
# the workarounds GitHub documents for this restriction, `pull_request_target`
# is the one that keeps the automation self-contained: it runs in the context of
# the base branch with the repository's normal Actions secrets, so the App token
# can be minted. (Storing the App credentials a second time as Dependabot
# secrets would also work, but leaves the same credential in two places to
# rotate.) Because the workflow file is read from the base branch, this fix
# applies to Dependabot PRs that are already open, not just new ones.
#
# Safety note for pull_request_target: this checks out the PR head and runs
# `dotnet restore`, which evaluates MSBuild project files from that branch. The
# job guard below therefore refuses anything that is not a same-repository
# `dependabot/nuget/**` branch; Dependabot never opens PRs from forks, so a
# fork head reaching this workflow would itself be the anomaly.
#
# Self-limiting by design, in two layers:
#   1. The regeneration is deterministic (see the Release note on the restore
#      step), so re-running it on an already-regenerated branch produces no
#      diff and the job exits before committing anything.
#   2. The commit this workflow pushes is authored by the jim-automation App,
#      and the guard below skips runs whose PR head was last touched by that
#      App. Unlike the previous `github.actor == 'dependabot[bot]'` guard, this
#      still fires when a human pushes to a Dependabot branch (a maintainer
#      merging `main` into it, say), which is exactly when the lock files can
#      drift back out of date.
#
# Identity / token choice (same reasoning as apt-pin-check.yml and
# tooling-pin-check.yml):
#   1. `main` (and Dependabot branches, transitively, once merged) requires
#      signed commits. Commits created via the GitHub API (the GraphQL
#      createCommitOnBranch mutation below) are signed by GitHub and show as
#      "Verified"; a plain `git commit` from the runner would be unsigned and
#      is never used here.
#   2. Pushing with the default GITHUB_TOKEN does NOT trigger downstream
#      workflow runs, so the required CI checks would never run on the new
#      head. Pushing with a GitHub App installation token does trigger them.
#   The jim-automation App's credentials live in the JIM_AUTOMATION_APP_ID and
#   JIM_AUTOMATION_PRIVATE_KEY secrets; the workflow mints a short-lived
#   (1 hour) installation token from them per run.

name: regenerate-nuget-lock-files

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Keyed on the PR, not github.ref: under pull_request_target github.ref is the
  # base branch, which would collapse every Dependabot PR into one group and let
  # them cancel each other.
  group: regenerate-nuget-lock-files-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    # Same-repository dependabot/nuget branches only (see the safety note above),
    # and never the App's own regeneration push.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'dependabot/nuget/')
      && github.event.sender.login != 'jim-automation[bot]'
    runs-on: self-hosted
    steps:
      # Fails with a diagnosable message rather than create-github-app-token's
      # opaque "'client-id' ... must be set to a non-empty string", which is what
      # an empty secret looks like from inside the action. An empty value here
      # means the credentials are missing from the repository's Actions secrets.
      - name: Check App credentials are present
        env:
          APP_ID: ${{ secrets.JIM_AUTOMATION_APP_ID }}
          PRIVATE_KEY: ${{ secrets.JIM_AUTOMATION_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::JIM_AUTOMATION_APP_ID / JIM_AUTOMATION_PRIVATE_KEY are not readable in this run." \
                 "Regenerate the lock files manually: dotnet restore JIM.sln --force-evaluate -p:Configuration=Release"
            exit 1
          fi

      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.JIM_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.JIM_AUTOMATION_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # pull_request_target defaults to the base branch; the PR head is what
          # needs regenerating. Pinned to the exact SHA the event carried, so a
          # push landing mid-run cannot be silently regenerated against the
          # wrong tree (createCommitOnBranch's expectedHeadOid then rejects it).
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: 10.0.x

      # Configuration=Release is what makes this deterministic, and determinism
      # is what stops the workflow chasing its own tail. Directory.Build.props
      # appends a VersionSuffix of dev.<date>.<minutes-since-midnight> in Debug,
      # and project references are recorded in the lock file with the referenced
      # project's version - so a Debug regeneration rewrites every project entry
      # with a fresh timestamp on every run, producing a diff (and therefore a
      # commit, and therefore another run) that never converges. Release leaves
      # VersionSuffix empty, so re-running on an already-regenerated branch is a
      # genuine no-op. Locked-mode restore does not compare project versions, so
      # CI (which restores in Debug) is unaffected by the value recorded here.
      - name: Regenerate lock files
        run: dotnet restore JIM.sln --force-evaluate -p:Configuration=Release

      - name: Commit regenerated lock files, if any changed
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # The PR head branch, not github.ref_name: under pull_request_target
          # github.ref_name is the base branch, and committing the regenerated
          # lock files there would push straight to main.
          #
          # Passed via env rather than interpolated into the script body, so
          # the branch name can never be evaluated as script (CodeQL actions
          # injection hygiene; Dependabot branch names are trusted, belt and braces).
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          $ErrorActionPreference = 'Stop'

          $status = git status --porcelain -- '**/packages.lock.json'
          if (-not $status) {
            Write-Host 'No lock file changes needed; Dependabot bump was already consistent.'
            exit 0
          }

          $changed = @($status | ForEach-Object { $_.Substring(3) })
          Write-Host "Regenerated lock files:"; $changed | ForEach-Object { Write-Host "  $_" }

          # Signed commit via the GraphQL createCommitOnBranch mutation (same
          # mechanism as .github/scripts/open-pin-pr.ps1): commits made through
          # the GitHub API are signed by GitHub, satisfying the "main requires
          # signed commits" rule that a plain `git commit` from the runner
          # cannot. This pushes directly to the existing Dependabot branch
          # rather than opening a separate PR.
          $headOid = (git rev-parse HEAD).Trim()

          $additions = foreach ($path in $changed) {
              @{
                  path     = $path
                  contents = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path (Get-Location) $path)))
              }
          }

          $mutation = @'
          mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) { commit { oid url } }
          }
          '@

          $commitInput = @{
              branch          = @{ repositoryNameWithOwner = $env:GITHUB_REPOSITORY; branchName = $env:BRANCH_NAME }
              message         = @{ headline = 'chore: regenerate NuGet lock files for Dependabot update' }
              fileChanges     = @{ additions = @($additions) }
              expectedHeadOid = $headOid
          }
          $payload = @{ query = $mutation; variables = @{ input = $commitInput } } | ConvertTo-Json -Depth 10 -Compress

          $tmp = New-TemporaryFile
          try {
              $payload | Out-File -FilePath $tmp -Encoding utf8
              $resp = Get-Content -Raw $tmp | & gh api graphql --input -
              if ($LASTEXITCODE -ne 0) { throw "createCommitOnBranch call failed (exit $LASTEXITCODE): $resp" }
              $commitOid = ($resp | ConvertFrom-Json).data.createCommitOnBranch.commit.oid
              if (-not $commitOid) { throw "createCommitOnBranch returned no commit oid: $resp" }
              Write-Host "Created signed commit $commitOid on $env:BRANCH_NAME"
          } finally {
              Remove-Item $tmp -ErrorAction SilentlyContinue
          }
