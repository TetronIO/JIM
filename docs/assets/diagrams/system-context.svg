    <rect class="jimdg-system" x="930" y="520" width="200" height="64" rx="8"/>
    <text class="jimdg-system-name" x="1030" y="548">Cloud Applications</text>
    <text class="jimdg-system-sub" x="1030" y="569">SCIM 2.0</text>
  </g>
