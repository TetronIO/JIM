<!-- JIM as a hub for several SCIM 2.0 clients: each pushes to a Connected System of its own, -->
<!-- Synchronisation Rules decide what reaches the Metaverse, and other Connectors provision onward. -->
<!-- Embedded on Connectors > JIM SCIM 2.0 Service Provider Connector. -->
<!-- Hand-authored inline SVG, themed by the .jimdg-* classes in -->
<!-- docs/assets/stylesheets/custom.css (single source, light + dark). -->
<!-- Visual language: engineering/DESIGN.md > Diagrams. -->
<!-- NOTE: no blank lines or comments inside the <svg> element (pymdownx -->
<!-- snippets inlines this into markdown); structure uses <g> groups. -->
<svg class="jim-diagram" viewBox="0 0 1180 450" role="img" aria-labelledby="jimdg-ssh-title jimdg-ssh-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="jimdg-ssh-title">JIM as a hub for several SCIM 2.0 clients</title>
  <desc id="jimdg-ssh-desc">Three SCIM 2.0 clients, a head office identity provider, an acquired company's identity provider and a partner's JIM, each push Users and Groups to a Connected System of their own in JIM, and each Connected System imports what it was sent into its own Connector Space. Between the Connector Spaces and the Metaverse, Synchronisation Rules decide what goes further: the head office and acquired company accounts are matched on email address into one Metaverse Object per person, with the head office first for names and titles and the acquired company filling only the gaps, while the partner's Scoping Criteria admit contractors only. From the Metaverse, JIM's other Connectors provision the result onward to a directory over LDAP, a business application's SQL database and a SaaS application over SCIM 2.0. The organisations named are illustrative.</desc>
