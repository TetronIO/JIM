<!-- Inside the Application Layer (Developer Guide > Architecture): the -->
<!-- JimApplication facade and domain servers used by Web and Scheduler, and -->
<!-- the sync orchestration path used by the Worker's task processors. -->
<!-- Simplified for legibility; SyncServer also uses ISyncRepository -->
<!-- directly, and the deep-dive process diagrams carry the exact flows. -->
<!-- The boundary title is painted last (SVG paints in document order) so -->
<!-- the flow edges and any data packet pass behind it, not over it; the -->
<!-- knockout stroke on .jimdg-hub-title clears the gaps between glyphs. -->
<!-- Keep it the final element if you add anything to this file. -->
<!-- Hand-authored inline SVG, themed by the .jimdg-* classes in -->
<!-- docs/assets/stylesheets/custom.css (single source, light + dark). -->
<!-- Visual language: engineering/DESIGN.md > Diagrams. -->
<!-- NOTE: keep this file free of blank lines AND of comments inside the -->
<!-- <svg> element; it is inlined into markdown via pymdownx.snippets, and -->
<!-- python-markdown ends the raw-HTML block at either. Structure is -->
<!-- expressed with <g> groups instead. -->
<svg class="jim-diagram" viewBox="0 0 1160 880" role="img" aria-labelledby="jimdg-al-title jimdg-al-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="jimdg-al-title">Inside the Application Layer</title>
  <desc id="jimdg-al-desc">JIM.Web and JIM.Scheduler call the JimApplication facade, the single entry point to the domain servers: Metaverse, ConnectedSystem, ObjectMatching, Search, Security, SecurityAudit, Auth, Scheduler, Tasking, Activity, ChangeHistory, Certificate, ServiceSettings, FileSystem, InitialPassword, PasswordSynchronisation, ConfigurationChangePreview, SystemHealth, ExampleData and System, plus the configuration services. The JIM.Worker task processors bypass the facade and use SyncServer, which orchestrates the sync evaluation and execution servers (ExportEvaluation, ExportExecution, ScopingEvaluation, ScopeReconciliation and DriftDetection), and SyncEngine, the stateless sync domain logic with no I/O. The facade also exposes SyncPreview, which evaluates what synchronising an object would do through the same SyncEngine without writing anything. Domain servers reach PostgreSQL through IJimRepository; the sync servers use the dedicated ISyncRepository.</desc>
