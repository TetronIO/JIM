    <text class="jimdg-chip-label" x="180" y="250">LDAP Connector</text>
    <text class="jimdg-chip-sub" x="180" y="270">LDAP · LDAPS</text>
    <rect class="jimdg-chip" x="286" y="220" width="188" height="70" rx="8"/>
    <text class="jimdg-chip-label" x="380" y="250">File Connector</text>
    <text class="jimdg-chip-sub" x="380" y="270">CSV &amp; flat files</text>
    <rect class="jimdg-chip" x="486" y="220" width="188" height="70" rx="8"/>
    <text class="jimdg-chip-label" x="580" y="250">SQL Connector</text>
