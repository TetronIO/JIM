    <rect class="jimdg-hub" x="220" y="20" width="720" height="414" rx="8"/>
    <rect class="jimdg-layer" x="470" y="62" width="210" height="356" rx="8"/>
    <text class="jimdg-layer-title jimdg-anchor-middle" x="575" y="86">Synchronisation Rules</text>
    <rect class="jimdg-stage" x="260" y="85" width="170" height="80" rx="8"/>
    <text class="jimdg-owner-name" x="345" y="117">Head office</text>
    <text class="jimdg-stage-label" x="345" y="141">Connector Space</text>
    <rect class="jimdg-stage" x="260" y="205" width="170" height="80" rx="8"/>
    <text class="jimdg-owner-name" x="345" y="237">Acquired company</text>
    <text class="jimdg-stage-label" x="345" y="261">Connector Space</text>
    <rect class="jimdg-stage" x="260" y="325" width="170" height="80" rx="8"/>
    <text class="jimdg-owner-name" x="345" y="357">Partner&apos;s JIM</text>
    <text class="jimdg-stage-label" x="345" y="381">Connector Space</text>
    <rect class="jimdg-chip" x="490" y="99" width="170" height="52" rx="8"/>
    <text class="jimdg-chip-label jimdg-anchor-middle" x="575" y="121">Match on email</text>
    <text class="jimdg-chip-sub jimdg-anchor-middle" x="575" y="139">first for names, titles</text>
    <rect class="jimdg-chip" x="490" y="219" width="170" height="52" rx="8"/>
    <text class="jimdg-chip-label jimdg-anchor-middle" x="575" y="241">Match on email</text>
    <text class="jimdg-chip-sub jimdg-anchor-middle" x="575" y="259">fills only the gaps</text>
    <rect class="jimdg-chip" x="490" y="339" width="170" height="52" rx="8"/>
    <text class="jimdg-chip-label jimdg-anchor-middle" x="575" y="361">Scope: contractors</text>
    <text class="jimdg-chip-sub jimdg-anchor-middle" x="575" y="379">everyone else stays out</text>
    <rect class="jimdg-core" x="730" y="185" width="170" height="120" rx="8"/>
    <text class="jimdg-core-title" x="815" y="240">Metaverse</text>
    <text class="jimdg-core-sub" x="815" y="264">one MVO per person</text>
  </g>
