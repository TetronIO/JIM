<!-- What a synchronisation visits and where scope is checked (Configuration > Scoping Criteria): the objects a Delta or Full Synchronisation visits, the import and export scope checks, and the objects a Delta never reaches. -->
<!-- Two layouts in the generated-diagram language (docs/hooks/diagrams.py classes), wide and narrow, -->
<!-- inside the .jim-dg wrapper the site's CSS uses to show one per breakpoint. Themed by the -->
<!-- .jimdg-* classes in docs/assets/stylesheets/custom.css (single source, light + dark). -->
<!-- Visual language: engineering/DESIGN.md > Diagrams. -->
