    <text class="jimdg-chip-label" x="780" y="250">SCIM 2.0 Client Connector</text>
    <text class="jimdg-chip-sub" x="780" y="270">SCIM 2.0 · HTTPS</text>
    <rect class="jimdg-chip" x="886" y="220" width="188" height="70" rx="8"/>
    <text class="jimdg-chip-label" x="980" y="242">SCIM 2.0 Service</text>
    <text class="jimdg-chip-label" x="980" y="259">Provider Connector</text>
    <text class="jimdg-chip-sub" x="980" y="278">Preview · import only</text>
