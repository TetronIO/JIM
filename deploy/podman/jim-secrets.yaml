# JIM on Podman: secrets
#
# Podman keeps these in its secret store, readable only by root (or, rootless, by the account that runs JIM). The pod
# files refer to them by name, so no secret is ever written into them. setup.sh does all of this for you. By hand:
#
#   1. Copy this file somewhere private, and fill in the values.
#   2. Store the secrets, as the account that runs JIM:  podman kube play jim-secrets.yaml
#   3. Delete the copy:                                  shred -u jim-secrets.yaml
#
# To change a value later, remove the stored secrets first (podman secret rm jim-secrets), store them again, and
# restart JIM.
#
# Quote any value containing a quotation mark, ": " or " #", escaping a " inside it as \".

apiVersion: v1
kind: Secret
metadata:
  name: jim-secrets
stringData:
  # The password of the database account JIM_DB_USERNAME. For the bundled PostgreSQL, choose a strong one: the
  # database is created with it on first start.
  JIM_DB_PASSWORD: ""
  # The client secret of JIM's registration at your identity provider.
  JIM_SSO_SECRET: ""
  # Optional: an API key created at start-up for automated configuration. It must start with jim_ak_ and be at
  # least 32 characters; generate one with: echo "jim_ak_$(openssl rand -hex 32)"
  # JIM_INFRASTRUCTURE_API_KEY: jim_ak_...
