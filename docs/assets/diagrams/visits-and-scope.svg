<g class="jimdg-dg-node"><rect class="jimdg-stage" x="24" y="323" width="312" height="45" rx="8"/><text class="jimdg-dg-label" x="180" y="350">Joined to an object visited</text></g>
<g class="jimdg-dg-node"><rect class="jimdg-stage" x="24" y="378" width="312" height="62" rx="8"/><text class="jimdg-dg-label" x="180" y="405">Flagged for review</text><text class="jimdg-dg-sub" x="180" y="422">at the end of the run</text></g>
<polyline class="jimdg-flow" fill="none" points="180,452 180,474"/>
<polygon class="jimdg-flow-arrow" points="180,480 175.5,472 184.5,472"/>
<g class="jimdg-dg-node"><rect class="jimdg-core" x="12" y="480" width="336" height="62" rx="8"/><text class="jimdg-dg-label-on" x="180" y="507">Export scope</text><text class="jimdg-dg-sub-on" x="180" y="524">each export rule's Scoping Criteria</text></g>
