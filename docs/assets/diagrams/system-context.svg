  </g>
  <g id="jimdg-sc-labels">
    <text class="jimdg-spoke-label jimdg-anchor-middle" x="377" y="172">web UI · PowerShell</text>
    <text class="jimdg-spoke-label jimdg-anchor-middle" x="580" y="172">REST API</text>
    <text class="jimdg-spoke-label jimdg-anchor-middle" x="783" y="172">OIDC</text>
