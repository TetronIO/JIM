    <text class="jimdg-layer-title" x="350" y="368">Domain servers</text>
    <text class="jimdg-system-sub" x="350" y="396">Metaverse · ConnectedSystem · ObjectMatching · Search</text>
    <text class="jimdg-system-sub" x="350" y="417">Security · SecurityAudit · Auth · Scheduler · Tasking</text>
    <text class="jimdg-system-sub" x="350" y="438">Activity · ChangeHistory · Certificate · ServiceSettings</text>
    <text class="jimdg-system-sub" x="350" y="459">FileSystem · InitialPassword · PasswordSynchronisation</text>
    <text class="jimdg-system-sub" x="350" y="480">ConfigurationChangePreview · SystemHealth</text>
    <text class="jimdg-system-sub" x="350" y="501">ExampleData · System · configuration services</text>
    <rect class="jimdg-layer" x="630" y="340" width="420" height="190" rx="8"/>
    <text class="jimdg-layer-title" x="840" y="368">Sync evaluation &amp; execution</text>
    <text class="jimdg-system-sub" x="840" y="410">ExportEvaluation · ExportExecution</text>
    <text class="jimdg-system-sub" x="840" y="434">ScopingEvaluation · ScopeReconciliation</text>
    <text class="jimdg-system-sub" x="840" y="458">DriftDetection · SyncPreview</text>
  </g>
