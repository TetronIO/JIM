# Production override for JIM
# Removes build contexts (uses pre-built images from GHCR) and sets production restart policy.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml --profile with-db up -d
#
# Requires DOCKER_REGISTRY and JIM_VERSION in .env, e.g.:
#   DOCKER_REGISTRY=ghcr.io/tetronio/
#   JIM_VERSION=0.3.0

services:
  jim.web:
    build: !reset null
    restart: unless-stopped
    # Publish the web UI and API on the host. JIM_WEB_PORT in .env changes the host port, and takes
    # an address prefix to bind one interface only (e.g. 127.0.0.1:5200 behind a local reverse proxy).
    ports:
      - "${JIM_WEB_PORT:-5200}:8080"

  jim.worker:
    build: !reset null
    restart: unless-stopped

  jim.scheduler:
    build: !reset null
    restart: unless-stopped

  jim.database:
    restart: unless-stopped
