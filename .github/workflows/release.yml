# Release workflow for JIM
# Triggered by pushing a tag like v0.2.0
#
# This workflow:
# 1. Validates the build, tests, and version consistency
# 2. Builds, scans, smoke-tests, and pushes Docker images to ghcr.io
# 3. Publishes PowerShell module to PSGallery
# 4. Creates an air-gapped release bundle
# 5. Creates a GitHub Release with all assets

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

permissions:
  contents: write
  packages: write
  id-token: write    # For cosign signing
  attestations: write # For SLSA provenance

# Split-trust runner model (see ci.yml): tag pushes come only from authorised
# maintainers, so every job here runs on the fast self-hosted runner. Nothing
# pull_request-triggered ever runs on that runner, which is what keeps building
# release artefacts on it acceptable for a public repo.
jobs:
  # Job 1: Validate build, tests, and version consistency
  validate:
    name: Validate Build & Tests
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # Phase 1: Version validation gate
      - name: Validate version consistency
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Version mismatch: tag is v${TAG_VERSION} but VERSION file contains ${FILE_VERSION}"
            exit 1
          fi
          echo "Version validated: ${TAG_VERSION}"

      - name: Validate PowerShell manifest version
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          $numericVersion = ($tagVersion -split '-')[0]  # Strip prerelease suffix
          $manifest = Import-PowerShellDataFile './src/JIM.PowerShell/JIM.psd1'
          if ($manifest.ModuleVersion -ne $numericVersion) {
            Write-Error "PowerShell manifest version ($($manifest.ModuleVersion)) does not match tag ($numericVersion)"
            exit 1
          }
          Write-Host "PowerShell manifest version validated: $numericVersion"

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore JIM.sln --locked-mode

      - name: Build
        run: dotnet build JIM.sln --no-restore --configuration Release

      - name: Run .NET tests
        run: dotnet test JIM.sln --no-build --configuration Release --verbosity normal

      # Gated here as well as in CI, so a release cannot ship a file without
      # its copyright notice even if it is cut from a ref that bypassed CI.
      - name: Lint copyright headers
        shell: pwsh
        run: pwsh -File ./scripts/Lint-CopyrightHeaders.ps1

      - name: Run Pester tests
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0 -Force -Scope CurrentUser
          $config = New-PesterConfiguration
          $config.Run.Path = @('./src/JIM.PowerShell/Tests', './scripts/Tests', './test/integration/utils')
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  # Job 2: Build, scan, smoke-test, and push Docker images
  build-containers:
    name: Build & Push Docker Images
    runs-on: self-hosted
    needs: validate

    strategy:
      # One image at a time. The self-hosted runners share one host: one Docker daemon, one Docker credential
      # file and one home directory. Three image jobs at once collided on the smoke-test container name, raced
      # installing cosign into the same directory (a corrupt download failed its checksum), and let the first
      # job to finish log the others out of the registry. Serial costs a few minutes per release; a release
      # that fails half-published costs far more.
      max-parallel: 1
      matrix:
        include:
          - image: jim-web
            dockerfile: src/JIM.Web/Dockerfile
            startup-log: "Starting JIM.Web"
          - image: jim-worker
            dockerfile: src/JIM.Worker/Dockerfile
            startup-log: "Starting JIM.Worker"
          - image: jim-scheduler
            dockerfile: src/JIM.Scheduler/Dockerfile
            startup-log: "Starting JIM.Scheduler"

    steps:
      # The self-hosted runners share one home directory, so without this every job reads and writes the same
      # ~/.docker: `setup-buildx-action --use` in one job switches every runner onto its builder (and removes
      # it when that job ends, killing any build still using it), and the login action's `docker logout`
      # logs every runner out of the registry (#1773). A per-job copy keeps the host's settings and plugins
      # while keeping each job's changes to itself. The runner empties RUNNER_TEMP after every job.
      - name: Isolate Docker client config
        run: |
          DOCKER_CONFIG_DIR="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG_DIR"
          if [ -f "$HOME/.docker/config.json" ]; then cp "$HOME/.docker/config.json" "$DOCKER_CONFIG_DIR/"; fi
          if [ -d "$HOME/.docker/cli-plugins" ]; then ln -s "$HOME/.docker/cli-plugins" "$DOCKER_CONFIG_DIR/cli-plugins"; fi
          echo "DOCKER_CONFIG=$DOCKER_CONFIG_DIR" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set image prefix
        id: prefix
        run: echo "IMAGE_PREFIX=$(echo 'ghcr.io/${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # Phase 8: Docker layer caching
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ${{ steps.prefix.outputs.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      # Phase 3 & 4: Build locally first, scan, smoke-test, then push that same image
      # Every build argument, assembled once for both builds below. The local build is the one scanned and
      # smoke-tested; the push build reuses its layers only if it passes exactly the same arguments, because an
      # argument a RUN reads is part of that layer's cache key. They differed until #1792 (APT_REFRESH reached
      # only the local build), so each release re-ran apt-get upgrade after testing and shipped an image nobody
      # had scanned. Today's date is part of the apt upgrade layer's cache key, so the release image carries
      # what the noble archive holds today rather than what it held when the cached layer was last built (see
      # the same step on the scan-images job in ci.yml for why a no-cache filter is not enough). The SDK build
      # stage still comes from the cache. The version goes in via env rather than being interpolated into the
      # script.
      - name: Assemble build arguments
        id: build_args
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          {
            echo 'list<<BUILD_ARGS'
            echo "VERSION=$VERSION"
            echo "APT_REFRESH=$(date -u +%F)"
            echo 'BUILD_ARGS'
          } >> "$GITHUB_OUTPUT"

      - name: Build Docker image (local)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ steps.prefix.outputs.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.version.outputs.VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.build_args.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # Phase 3: Container vulnerability scanning
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # 0.36.0
        with:
          image-ref: ${{ steps.prefix.outputs.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.version.outputs.VERSION }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # Phase 4: Smoke test — verify container starts and logs expected startup message
      # Note: HTTP-based smoke tests are not viable because JIM.Web blocks on database
      # migration checks during startup (before it begins serving HTTP). All services
      # use log-based verification instead.
      - name: Smoke test container
        run: |
          IMAGE="${{ steps.prefix.outputs.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.version.outputs.VERSION }}"

          # The self-hosted runners share one Docker daemon, and the three matrix jobs run at the same time, so
          # the container name must be unique per image and per run: a fixed name let one image's smoke test
          # collide with another's ("The container name ... is already in use") and failed the v0.15.0 release.
          # The trap removes the container however the step ends, including cancellation, so none is left
          # running on the persistent runner to block a later run.
          NAME="smoke-test-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}"
          trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true' EXIT

          # Reap a container left running under the old fixed name by a job cancelled before this fix.
          docker rm -f smoke-test >/dev/null 2>&1 || true

          # Start with dummy config — the service will log its startup
          # message before attempting database connection
          docker run -d --name "$NAME" \
            -e JIM_DB_HOSTNAME=localhost \
            -e JIM_DB_NAME=jim \
            -e JIM_DB_USERNAME=jim \
            -e JIM_DB_PASSWORD=dummy \
            -e JIM_LOG_LEVEL=Information \
            -e JIM_LOG_PATH=/tmp/jim-logs \
            "$IMAGE"

          # Wait up to 10 seconds for the startup log message
          for i in $(seq 1 10); do
            if docker logs "$NAME" 2>&1 | grep -q "${{ matrix.startup-log }}"; then
              echo "Startup log found: ${{ matrix.startup-log }}"
              exit 0
            fi
            sleep 1
          done

          echo "::error::Container did not log expected startup message within 10 seconds"
          docker logs "$NAME"
          exit 1

      # Push the image the steps above tested (after scan and smoke test pass). This repeats the local build on the
      # same builder with the same Dockerfile, labels and arguments, so every layer is served from the cache the
      # local build has just filled and nothing is rebuilt. It pushes by digest only: no release tag moves until
      # the next step has shown the pushed layers are the tested ones.
      - name: Push Docker image (by digest)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ${{ matrix.dockerfile }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.build_args.outputs.list }}
          outputs: type=image,name=${{ steps.prefix.outputs.IMAGE_PREFIX }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}

      # The pushed image must be the tested image (#1792). This compares filesystem layers (the image's diff IDs),
      # which are what the scan and the smoke test examined, rather than manifest digests: the push adds a
      # provenance attestation, so its manifest digest never matches a loaded image's. A layer rebuilt after
      # testing fails this even when it installed the same packages, because its files carry new timestamps,
      # which is exactly how v0.15.0's rebuilt apt layer would have shown up.
      - name: Confirm the pushed image is the tested image
        env:
          TESTED: ${{ steps.prefix.outputs.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.version.outputs.VERSION }}
          PUSHED: ${{ steps.prefix.outputs.IMAGE_PREFIX }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull --quiet "$PUSHED" > /dev/null
          tested_layers=$(docker image inspect --format '{{json .RootFS.Layers}}' "$TESTED")
          pushed_layers=$(docker image inspect --format '{{json .RootFS.Layers}}' "$PUSHED")
          if [ "$tested_layers" != "$pushed_layers" ]; then
            echo "::error title=Pushed image is not the tested image::$PUSHED has different layers from the image that was scanned and smoke-tested, so it was rebuilt after testing. No release tag points at it. Check that both builds receive the same build arguments."
            echo "Tested: $tested_layers"
            echo "Pushed: $pushed_layers"
            exit 1
          fi
          echo "$PUSHED carries the tested image's $(grep -o 'sha256:' <<< "$tested_layers" | wc -l) layers."

      # Only now do the release tags point at the image. With a single source, imagetools create copies the
      # manifest unchanged, so every tag resolves to the verified digest that is signed and attested below.
      - name: Tag the pushed image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE: ${{ steps.prefix.outputs.IMAGE_PREFIX }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$SOURCE"

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
        with:
          # Per-runner, not the shared home directory the runners have in common (see max-parallel above).
          install-dir: ${{ runner.temp }}/cosign

      - name: Sign container image
        run: |
          IMAGE_REF="${{ steps.prefix.outputs.IMAGE_PREFIX }}/${{ matrix.image }}"
          cosign sign --yes "${IMAGE_REF}@${{ steps.build.outputs.digest }}"

      # Phase 6a: SBOM generation
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          image: ${{ steps.prefix.outputs.IMAGE_PREFIX }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json

      - name: Attach SBOM to image
        run: |
          IMAGE_REF="${{ steps.prefix.outputs.IMAGE_PREFIX }}/${{ matrix.image }}"
          cosign attest --yes --type spdxjson \
            --predicate sbom-${{ matrix.image }}.spdx.json \
            "${IMAGE_REF}@${{ steps.build.outputs.digest }}"

      # Phase 6b: SLSA provenance attestation
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0
        with:
          subject-name: ${{ steps.prefix.outputs.IMAGE_PREFIX }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Phase 6c: Upload SBOM as artifact for GitHub Release
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.spdx.json
          retention-days: 5

  # Job 3: Publish the documentation site with the latest OpenAPI document.
  # Extracts the pre-generated OpenAPI JSON from the released jim-web Docker image,
  # drops it into the docs/ tree, builds the MkDocs site, and deploys to GitHub Pages.
  # This ensures the public API reference at https://docs.junctional.io/api/reference/
  # always matches the latest stable release.
  #
  # Deployment goes through the GitHub Actions Pages pipeline rather than a gh-pages
  # branch push; see the header of docs.yml for why. The deploy-docs job below shares
  # the "pages" concurrency group with docs.yml and publish-api-reference.yml.
  publish-docs:
    name: Publish Documentation Site
    runs-on: self-hosted
    needs: [validate, build-containers]
    # Narrower than the workflow-level grant: this job only reads the repo and pulls
    # the released image. The Pages write happens in deploy-docs.
    permissions:
      contents: read
      packages: read

    steps:
      # The self-hosted runners share one home directory, so without this every job reads and writes the same
      # ~/.docker: `setup-buildx-action --use` in one job switches every runner onto its builder (and removes
      # it when that job ends, killing any build still using it), and the login action's `docker logout`
      # logs every runner out of the registry (#1773). A per-job copy keeps the host's settings and plugins
      # while keeping each job's changes to itself. The runner empties RUNNER_TEMP after every job.
      - name: Isolate Docker client config
        run: |
          DOCKER_CONFIG_DIR="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG_DIR"
          if [ -f "$HOME/.docker/config.json" ]; then cp "$HOME/.docker/config.json" "$DOCKER_CONFIG_DIR/"; fi
          if [ -d "$HOME/.docker/cli-plugins" ]; then ln -s "$HOME/.docker/cli-plugins" "$DOCKER_CONFIG_DIR/cli-plugins"; fi
          echo "DOCKER_CONFIG=$DOCKER_CONFIG_DIR" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set image prefix
        id: prefix
        run: echo "IMAGE_PREFIX=$(echo 'ghcr.io/${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OpenAPI document from jim-web image
        run: |
          IMAGE="${{ steps.prefix.outputs.IMAGE_PREFIX }}/jim-web:${{ steps.version.outputs.VERSION }}"
          docker pull "$IMAGE"
          CONTAINER_ID=$(docker create "$IMAGE")
          docker cp "${CONTAINER_ID}:/app/wwwroot/api/openapi/v1.json" docs/api/reference/v1.json
          docker rm "$CONTAINER_ID"
          echo "Extracted OpenAPI document: $(wc -c < docs/api/reference/v1.json) bytes"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: 3.x

      - name: Install MkDocs
        run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.7,<10" "mkdocs-glightbox>=0.4,<1"

      - name: Build site
        # --strict: see the comment on the equivalent step in docs.yml. Safe to fail a release on,
        # because nothing in the release depends on publish-docs; a broken-link failure here loses the
        # docs publish for that release and leaves the containers, module and GitHub Release intact.
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  # Job 3b: Deploy the built documentation site to GitHub Pages.
  deploy-docs:
    name: Deploy Documentation Site
    runs-on: self-hosted
    needs: publish-docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        with:
          # See docs.yml for why this is raised above the action's 10-minute default.
          timeout: 1200000

  # Job 4: Publish PowerShell module to PSGallery
  # Depends on build-containers to ensure nothing publishes if Docker builds fail
  publish-powershell:
    name: Publish PowerShell Module
    runs-on: self-hosted
    needs: [validate, build-containers]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # Publish-Module needs the dotnet CLI for NuGet-based repositories. GitHub-hosted runners have it; the
      # self-hosted runners do not, so it is installed for this job as the validate job installs it.
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update module version
        shell: pwsh
        run: |
          $manifestPath = './src/JIM.PowerShell/JIM.psd1'
          $fullVersion = '${{ steps.version.outputs.VERSION }}'

          # Split version and prerelease (e.g., "0.3.0-alpha" -> "0.3.0" + "alpha")
          if ($fullVersion -match '^(\d+\.\d+\.\d+)(?:-(.+))?$') {
            $moduleVersion = $Matches[1]
            $prerelease = $Matches[2]
          } else {
            throw "Invalid version format: $fullVersion"
          }

          # Read the manifest content
          $content = Get-Content $manifestPath -Raw

          # Update ModuleVersion (numeric part only - PSGallery requires X.Y.Z format)
          $content = $content -replace "ModuleVersion\s*=\s*'[^']*'", "ModuleVersion = '$moduleVersion'"

          # Update or set Prerelease tag
          if ($prerelease) {
            # Set prerelease (uncomment if commented, or update value)
            $content = $content -replace "#?\s*Prerelease\s*=\s*'[^']*'", "Prerelease = '$prerelease'"
            Write-Host "Set Prerelease to '$prerelease'"
          } else {
            # Remove prerelease (comment it out)
            $content = $content -replace "(\s*)Prerelease\s*=\s*'[^']*'", "`$1# Prerelease = ''"
            Write-Host "Removed Prerelease (stable release)"
          }

          # Write back
          Set-Content $manifestPath -Value $content

          Write-Host "Updated module version to $moduleVersion (full: $fullVersion)"

      - name: Publish to PSGallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) {
            Write-Warning "PSGALLERY_API_KEY not set - skipping PSGallery publish"
            exit 0
          }

          $fullVersion = '${{ steps.version.outputs.VERSION }}'

          # Check if this version already exists on PSGallery (idempotency for re-runs)
          $existing = Find-Module -Name JIM -RequiredVersion $fullVersion -ErrorAction SilentlyContinue
          if ($existing) {
            Write-Host "Version $fullVersion already published to PSGallery - skipping"
            exit 0
          }

          # Publish-Module requires the folder name to match the module name ('JIM')
          $stagingPath = './publish-staging/JIM'
          New-Item -ItemType Directory -Path $stagingPath -Force | Out-Null
          Copy-Item -Path './src/JIM.PowerShell/*' -Destination $stagingPath -Recurse -Exclude 'Tests'

          # Test the module can be imported
          Import-Module $stagingPath -Force

          # Publish to PSGallery
          Publish-Module -Path $stagingPath -NuGetApiKey $env:PSGALLERY_API_KEY -Verbose

  # Job 4: Create release bundle for air-gapped deployments
  create-bundle:
    name: Create Release Bundle
    runs-on: self-hosted
    needs: build-containers

    outputs:
      bundle-name: ${{ steps.bundle.outputs.name }}

    steps:
      # The self-hosted runners share one home directory, so without this every job reads and writes the same
      # ~/.docker: `setup-buildx-action --use` in one job switches every runner onto its builder (and removes
      # it when that job ends, killing any build still using it), and the login action's `docker logout`
      # logs every runner out of the registry (#1773). A per-job copy keeps the host's settings and plugins
      # while keeping each job's changes to itself. The runner empties RUNNER_TEMP after every job.
      - name: Isolate Docker client config
        run: |
          DOCKER_CONFIG_DIR="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG_DIR"
          if [ -f "$HOME/.docker/config.json" ]; then cp "$HOME/.docker/config.json" "$DOCKER_CONFIG_DIR/"; fi
          if [ -d "$HOME/.docker/cli-plugins" ]; then ln -s "$HOME/.docker/cli-plugins" "$DOCKER_CONFIG_DIR/cli-plugins"; fi
          echo "DOCKER_CONFIG=$DOCKER_CONFIG_DIR" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release bundle
        id: bundle
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.VERSION }}'
          ./scripts/Build-ReleaseBundle.ps1 -Version $version -OutputPath ./release-output

          $bundleName = "jim-release-$version"
          echo "name=$bundleName" >> $env:GITHUB_OUTPUT

      - name: Upload bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-bundle
          path: ./release-output/jim-release-${{ steps.version.outputs.VERSION }}.tar.gz
          retention-days: 5

      - name: Upload checksums artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: checksums
          path: ./release-output/jim-release-${{ steps.version.outputs.VERSION }}/checksums.sha256
          retention-days: 5

  # Job 5: Create GitHub Release
  create-release:
    name: Create GitHub Release
    runs-on: self-hosted
    needs: [build-containers, publish-powershell, create-bundle]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # "Create GitHub Release" below uses the GitHub CLI. GitHub-hosted runners have it; the self-hosted
      # runners may not, so fetch a pinned, checksum-verified copy into this job's temp directory when absent.
      - name: Ensure GitHub CLI
        env:
          GH_CLI_VERSION: 2.97.0
          GH_CLI_SHA256: a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112
        run: |
          if command -v gh >/dev/null 2>&1; then
            echo "Using the runner's GitHub CLI: $(gh --version | head -1)"
            exit 0
          fi
          archive="gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/${archive}"
          echo "${GH_CLI_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/gh_${GH_CLI_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download bundle artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-bundle
          path: ./artifacts

      - name: Download checksums artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: checksums
          path: ./artifacts

      - name: Download SBOM artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: sbom-*
          path: ./artifacts/sbom
          merge-multiple: true

      # Phase 9b: Changelog extraction validation
      - name: Extract release notes from CHANGELOG
        id: changelog
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.VERSION }}'
          $changelog = Get-Content ./CHANGELOG.md -Raw

          # Extract section for this version
          # Use (?s) (single-line) so . matches newlines, and \z for absolute end-of-string
          # This avoids (?m) multiline mode where $ matches every line boundary
          $pattern = "(?s)## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=\n## \[|\z)"
          if ($changelog -match $pattern) {
            $notes = $Matches[1].Trim()
          } else {
            Write-Error "No changelog section found for version $version. Ensure CHANGELOG.md has a ## [$version] section."
            exit 1
          }
          if ($notes.Length -lt 20) {
            Write-Warning "Changelog section for $version is suspiciously short ($($notes.Length) chars). Verify content."
          }

          # Write to file for GitHub CLI
          $notes | Set-Content ./release-notes.md
          Write-Host "Release notes:"
          Write-Host $notes

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}

          gh release create "v${VERSION}" \
            --title "JIM v${VERSION}" \
            --notes-file ./release-notes.md \
            ./artifacts/jim-release-${VERSION}.tar.gz \
            ./artifacts/checksums.sha256 \
            ./artifacts/sbom/*.spdx.json \
            ./docker-compose.yml \
            ./deploy/docker-compose.production.yml \
            ./.env.example

  # Job 6: Notify the junctional.io marketing site to rebuild.
  # The site fetches the current JIM version from GitHub at build time, so a
  # rebuild is needed after each release for the displayed version to update.
  # We send a repository_dispatch event; junctional.io's deploy workflow listens
  # for type 'jim-release' on its default branch.
  #
  # Gated to stable releases only (same `!contains(github.ref, '-')` condition the
  # Docker `latest` tag uses) so a prerelease tag does not push an alpha version
  # onto the public site.
  #
  # Auth: the cross-repo dispatch cannot use the default GITHUB_TOKEN (scoped to
  # this repo only). We mint a short-lived installation token for the
  # jim-automation GitHub App, whose credentials are stored in the JIM_AUTOMATION_*
  # secrets (shared automation account; also installed on TetronIO/junctional.io
  # with Contents: write). The token is scoped to junctional.io alone.
  notify-site:
    name: Notify junctional.io
    runs-on: self-hosted
    needs: create-release
    if: ${{ !contains(github.ref, '-') }}

    # This job authenticates with the app installation token, not GITHUB_TOKEN.
    permissions:
      contents: read

    steps:
      - name: Mint junctional.io-scoped token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.JIM_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.JIM_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: junctional.io

      # Non-fatal: the release itself has already published by this point, so a
      # transient dispatch failure must not mark the release run as failed. The
      # step still surfaces a red annotation if it fails.
      - name: Dispatch rebuild to junctional.io
        continue-on-error: true
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0  # v3.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ github.repository_owner }}/junctional.io
          event-type: jim-release
