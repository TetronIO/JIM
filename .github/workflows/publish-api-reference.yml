name: Publish API Reference

# Manually publish the JIM API Reference to GitHub Pages.
#
# This workflow regenerates the OpenAPI document from the current code on main
# and deploys the MkDocs site, updating the public reference at
# https://docs.junctional.io/api/reference/.
#
# Use this to:
#   - Validate the API reference deploy process outside of a release
#   - Refresh the published reference between releases (e.g. after a docs-only fix)
#
# The release workflow automatically updates the reference on every release by
# extracting the baked-in OpenAPI JSON from the released jim-web Docker image.
#
# Deployment goes through the GitHub Actions Pages pipeline rather than a
# gh-pages branch push; see the header of docs.yml for why, and note that all
# three publishing workflows share the "pages" concurrency group.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Generate and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Generate OpenAPI document
        run: pwsh -File ./scripts/Generate-OpenApiDoc.ps1 -OutputPath "$PWD/docs/api/reference/v1.json"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: 3.x

      - name: Install MkDocs
        run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.7,<10" "mkdocs-glightbox>=0.4,<1"

      - name: Build site
        # --strict: see the comment on the equivalent step in docs.yml.
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
        with:
          # See docs.yml for why this is raised above the action's 10-minute default.
          timeout: 1200000
