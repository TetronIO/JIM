# CodeQL static analysis - scans for security vulnerabilities and code quality issues
# Replaces GitHub's default CodeQL setup to produce a single predictable workflow run
# with stable check names for the branch protection ruleset.
#
# Languages: actions (GitHub Actions workflows), csharp, javascript-typescript

name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:  # Runs on ALL pull requests regardless of target branch, matching ci.yml.
                 # A stacked PR targets the layer below it rather than main, and every PR in a
                 # stack is still evaluated against main's ruleset, so filtering to main here
                 # left the required Analyze checks permanently unreported on every layer but
                 # the bottom one, and the stack could never be merged.
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Split-trust runner model (see ci.yml): push and schedule runs are trusted and use
    # the fast self-hosted runner; pull_request runs execute fork code and stay on
    # GitHub-hosted VMs.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'self-hosted' }}

    permissions:
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # C# is built by hand rather than by Autobuild. Autobuild builds JIM.sln, test projects
        # included, and CodeQL extracts and analyses whatever is built; every result in a test
        # project is then thrown away before upload (paths-ignore in codeql-config.yml, enforced by
        # scripts/Filter-Sarif.ps1). The traced build of the whole solution was the slowest step
        # of any required check (Autobuild alone took 7 to 10 minutes), and most of that was test
        # code whose findings nobody sees. Building only the shipped projects under src/ analyses
        # the same shipped code for less. The job names, and so the required check names, are
        # unchanged: they come from matrix.language.
        include:
          - language: actions
            build-mode: none
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

    - name: Setup .NET
      if: matrix.build-mode == 'manual'
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
      with:
        dotnet-version: 10.0.x

    - name: Initialize CodeQL
      uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4  # v3.38.1
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        config-file: ./.github/codeql/codeql-config.yml

    # Every project under src/ and nothing else: that is the code JIM ships. A glob rather than a
    # list, so a new src/ project is analysed without editing this file. CodeQL's tracer adds the
    # compiler flags it needs (UseSharedCompilation=false among them) to each dotnet build itself.
    # Dependencies shared between projects compile once; later builds find them up to date.
    - name: Build the shipped projects
      if: matrix.build-mode == 'manual'
      run: |
        for project in src/*/*.csproj; do
          dotnet build "$project"
        done

    # The analyze/filter/upload split exists because the action applies the configuration's
    # paths-ignore to extraction only, which does nothing for compiled languages: C# is built and
    # analysed whole, and alerts in excluded paths re-mint on every analysis (and re-open past any
    # dismissal). Filtering the SARIF before upload is the only point the exclusion can be enforced
    # for every language identically. The filter reads the same paths-ignore block, so the config
    # file remains the single place a path is excluded.
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4  # v3.38.1
      with:
        category: "/language:${{ matrix.language }}"
        upload: failure-only
        output: sarif-results

    - name: Filter excluded paths from SARIF
      shell: pwsh
      run: ./scripts/Filter-Sarif.ps1 -SarifDirectory sarif-results -ConfigFile ./.github/codeql/codeql-config.yml

    - name: Upload filtered SARIF
      uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4  # v3.38.1
      with:
        sarif_file: sarif-results
        category: "/language:${{ matrix.language }}"
